name: patch-docs-path-guard

on:
  push:
    branches:
      - refactor/final-package-structure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[docs-path-guard-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/final-package-structure
          fetch-depth: 0
      - name: Fix repository path regex boundary
        run: |
          python .github/patch_docs_path_guard.py
          if git diff --quiet; then
            echo "No docs path guard change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_current_docs_consistency.py
          git commit -m "Fix docs repository path guard [docs-path-guard-patched]"
          git push origin HEAD:refactor/final-package-structure
