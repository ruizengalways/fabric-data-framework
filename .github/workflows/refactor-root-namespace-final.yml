name: refactor-root-namespace-final

on:
  push:
    branches:
      - codex/root-namespace-final

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/root-namespace-final
          fetch-depth: 0
      - name: Move remaining root implementation files to canonical owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          pkg = root / 'src' / 'fabric_data_framework'
          moves = {
              'config.py': 'metadata/config.py',
              'runtime.py': 'contracts/runtime.py',
              'infrastructure.py': 'contracts/environment.py',
              'dispatcher.py': 'orchestration/dispatcher.py',
          }
          module_map = {
              'config': 'metadata.config',
              'runtime': 'contracts.runtime',
              'infrastructure': 'contracts.environment',
              'dispatcher': 'orchestration.dispatcher',
          }

          for old, new in moves.items():
              subprocess.run(['git', 'mv', str(pkg / old), str(pkg / new)], check=True)

          # Rewrite all references to former root modules to explicit canonical owners.
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in module_map.items():
                      updated = updated.replace(
                          f'fabric_data_framework.{old}',
                          f'fabric_data_framework.{new}',
                      )
                      updated = re.sub(
                          rf'from \.{{1,6}}{re.escape(old)}(?P<tail>\.[A-Za-z0-9_.]+)? import ',
                          lambda m, new=new: f'from fabric_data_framework.{new}{m.group("tail") or ""} import ',
                          updated,
                      )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Modules that gained package depth need non-root sibling imports fixed explicitly.
          config = pkg / 'metadata' / 'config.py'
          text = config.read_text(encoding='utf-8')
          text = text.replace('from .contracts.', 'from ..contracts.')
          config.write_text(text, encoding='utf-8')

          dispatcher = pkg / 'orchestration' / 'dispatcher.py'
          text = dispatcher.read_text(encoding='utf-8')
          text = text.replace('from .execution.', 'from ..execution.')
          text = text.replace('from .contracts.', 'from ..contracts.')
          text = text.replace('from .orchestration.planner import ', 'from .planner import ')
          text = text.replace('from .control_plane.', 'from ..control_plane.')
          dispatcher.write_text(text, encoding='utf-8')

          # Remove compatibility-facade wording now that dispatcher has a real owner.
          text = dispatcher.read_text(encoding='utf-8')
          text = text.replace(
              '"""Compatibility facade for metadata-driven dataset orchestration.\n\nPlanning/dependency decisions live in ``orchestration.planner`` while concrete\nexecution lives behind a ready-wave backend. The established ``dispatch_datasets``\nAPI remains the in-process compatibility surface; ``dispatch_datasets_with_backend``\nlets Fabric/native backends consume the same dependency and criticality semantics.\n"""',
              '"""Metadata-driven dataset dispatch over planner-selected ready waves.\n\nPlanning/dependency decisions live in ``orchestration.planner`` while concrete\nexecution lives behind a ready-wave backend. Both in-process and Fabric/native backends\nconsume the same dependency and criticality semantics.\n"""',
          )
          dispatcher.write_text(text, encoding='utf-8')

          # Reuse the shared immutable contract base instead of keeping duplicate models.
          runtime = pkg / 'contracts' / 'runtime.py'
          text = runtime.read_text(encoding='utf-8')
          text = text.replace('from pydantic import BaseModel, ConfigDict, Field, model_validator', 'from pydantic import Field, model_validator')
          text = text.replace('from fabric_data_framework.metadata.config import Criticality, DatasetStatus, PipelineStatus, RunMode\nfrom fabric_data_framework.contracts.environment import EnvironmentName\n\n\nclass FrozenModel(BaseModel):\n    model_config = ConfigDict(frozen=True, extra="forbid", str_strip_whitespace=True)\n', 'from fabric_data_framework.metadata.config import Criticality, DatasetStatus, PipelineStatus, RunMode\nfrom .base import FrozenModel\nfrom .environment import EnvironmentName\n')
          runtime.write_text(text, encoding='utf-8')

          environment = pkg / 'contracts' / 'environment.py'
          text = environment.read_text(encoding='utf-8')
          text = text.replace('from pydantic import BaseModel, ConfigDict, Field', 'from pydantic import Field')
          text = text.replace('\n\nclass FrozenModel(BaseModel):\n    model_config = ConfigDict(frozen=True, extra="forbid", str_strip_whitespace=True)\n', '\n\nfrom .base import FrozenModel\n')
          environment.write_text(text, encoding='utf-8')

          # Current navigation docs should point to canonical owners only.
          doc_paths = (
              pkg / 'README.md',
              root / 'docs' / 'human' / 'REPOSITORY_GUIDE.md',
              root / 'docs' / 'machine' / 'IMPLEMENTATION_MAP.md',
          )
          replacements = {
              '`config.py`': '`metadata/config.py`',
              '`runtime.py`': '`contracts/runtime.py`',
              '`infrastructure.py`': '`contracts/environment.py`',
              '`dispatcher.py`': '`orchestration/dispatcher.py`',
          }
          for path in doc_paths:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          boundary = root / 'tests' / 'test_root_namespace_only.py'
          boundary.write_text('''from __future__ import annotations\n\nimport importlib\nfrom pathlib import Path\n\nimport pytest\n\n\nREPO_ROOT = Path(__file__).parents[1]\nPACKAGE_ROOT = REPO_ROOT / "src" / "fabric_data_framework"\n\nCANONICAL = {\n    "config": "metadata.config",\n    "runtime": "contracts.runtime",\n    "infrastructure": "contracts.environment",\n    "dispatcher": "orchestration.dispatcher",\n}\n\n\ndef test_framework_root_contains_no_implementation_modules():\n    root_python = {path.name for path in PACKAGE_ROOT.glob("*.py")}\n    assert root_python == {"__init__.py"}\n\n\n@pytest.mark.parametrize(("old", "new"), CANONICAL.items())\ndef test_remaining_root_modules_have_one_canonical_owner(old: str, new: str):\n    assert importlib.import_module(f"fabric_data_framework.{new}") is not None\n    with pytest.raises(ModuleNotFoundError):\n        importlib.import_module(f"fabric_data_framework.{old}")\n\n\ndef test_source_and_tests_do_not_reintroduce_root_module_imports():\n    forbidden = tuple(f"fabric_data_framework.{old}" for old in CANONICAL)\n    offenders: list[str] = []\n    current = Path(__file__).resolve()\n    for base in (REPO_ROOT / "src", REPO_ROOT / "tests"):\n        for path in sorted(base.rglob("*.py")):\n            if path.resolve() == current:\n                continue\n            text = path.read_text(encoding="utf-8")\n            for value in forbidden:\n                if value in text:\n                    offenders.append(f"{path.relative_to(REPO_ROOT)}: {value}")\n    assert offenders == []\n''', encoding='utf-8')

          offenders = []
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path == boundary:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for old in module_map:
                      if f'fabric_data_framework.{old}' in text:
                          offenders.append(f'{path}: fabric_data_framework.{old}')
                      if re.search(rf'from \.{{1,6}}{re.escape(old)}(?:\.| import)', text):
                          offenders.append(f'{path}: relative {old}')
          if offenders:
              raise RuntimeError('removed root imports remain:\n' + '\n'.join(offenders))

          remaining = sorted(path.name for path in pkg.glob('*.py'))
          if remaining != ['__init__.py']:
              raise RuntimeError(f'framework root still contains implementation modules: {remaining}')

          (root / '.github' / 'workflows' / 'refactor-root-namespace-final.yml').unlink()
          PY
      - name: Commit final root namespace layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: make framework root namespace-only"
          git push origin HEAD:codex/root-namespace-final
