name: runtime-safety-finalizer

on:
  push:
    branches:
      - fix/runtime-safety-hardening
    paths:
      - .github/scripts/runtime_safety_finalizer.py
      - .github/workflows/runtime-safety-finalizer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-safety-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply finalizer
        run: python .github/scripts/runtime_safety_finalizer.py
      - name: Commit generated edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework/adapters/fabric/rest.py \
                  src/fabric_data_framework/adapters/fabric/capture_transports.py \
                  tests/test_business_path_driver.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: close Fabric responses and sanitize capture evidence"
            git push origin HEAD:fix/runtime-safety-hardening
          fi
