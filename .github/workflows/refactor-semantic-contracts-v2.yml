name: refactor-semantic-contracts-v2

on:
  push:
    branches:
      - codex/semantic-contracts-package-v2

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-contracts-package-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract explicit semantic contract modules
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from collections import defaultdict
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          pkg = root / 'src' / 'fabric_data_framework'
          contracts = pkg / 'contracts'

          subprocess.run(['git', 'mv', str(pkg / 'schema_contract.py'), str(contracts / 'schema.py')], check=True)
          subprocess.run(['git', 'mv', str(pkg / 'target_operations.py'), str(contracts / 'target_operation.py')], check=True)

          (contracts / 'base.py').write_text(
              '"""Shared immutable Pydantic base for provider-neutral framework contracts."""\n\n'
              'from pydantic import BaseModel, ConfigDict\n\n\n'
              'class FrozenModel(BaseModel):\n'
              '    model_config = ConfigDict(frozen=True, extra="forbid", str_strip_whitespace=True)\n\n\n'
              '__all__ = ["FrozenModel"]\n',
              encoding='utf-8',
          )

          # Split the old mixed operations.py into explicit contract owners while preserving
          # the original class/function source bodies verbatim.
          operations_path = pkg / 'operations.py'
          operations_text = operations_path.read_text(encoding='utf-8')
          tree = ast.parse(operations_text)
          source: dict[str, str] = {}
          for node in tree.body:
              if isinstance(node, (ast.ClassDef, ast.FunctionDef)):
                  segment = ast.get_source_segment(operations_text, node)
                  if segment is not None:
                      source[node.name] = segment

          def blocks(names: tuple[str, ...]) -> str:
              return '\n\n\n'.join(source[name] for name in names) + '\n'

          (contracts / 'audit.py').write_text(
              '"""Pipeline, dataset and step execution audit contracts."""\n\n'
              'from __future__ import annotations\n\n'
              'from datetime import datetime, timezone\n'
              'from enum import Enum\n'
              'from uuid import UUID, uuid4\n\n'
              'from pydantic import Field, model_validator\n\n'
              'from ..config import DatasetStatus, PipelineStatus, RunMode\n'
              'from .base import FrozenModel\n\n\n'
              + blocks((
                  '_utcnow', '_require_aware', 'StepStatus', 'RowAccounting',
                  'MutationCounts', 'PipelineRunAudit', 'DatasetRunAudit', 'StepRunAudit',
              ))
              + '\n__all__ = [\n'
              '    "DatasetRunAudit", "MutationCounts", "PipelineRunAudit",\n'
              '    "RowAccounting", "StepRunAudit", "StepStatus",\n'
              ']\n',
              encoding='utf-8',
          )
          (contracts / 'reconciliation.py').write_text(
              '"""Reconciliation result and metric contracts."""\n\n'
              'from __future__ import annotations\n\n'
              'from datetime import datetime, timezone\n'
              'from enum import Enum\n'
              'from uuid import UUID, uuid4\n\n'
              'from pydantic import Field, model_validator\n\n'
              'from .base import FrozenModel\n\n\n'
              + blocks((
                  '_utcnow', '_require_aware', 'ReconciliationStatus',
                  'ReconciliationMetric', 'ReconciliationResult',
              ))
              + '\n__all__ = ["ReconciliationMetric", "ReconciliationResult", "ReconciliationStatus"]\n',
              encoding='utf-8',
          )
          (contracts / 'quarantine.py').write_text(
              '"""Quarantine batch contracts."""\n\n'
              'from __future__ import annotations\n\n'
              'from datetime import datetime, timezone\n'
              'from enum import Enum\n'
              'from uuid import UUID, uuid4\n\n'
              'from pydantic import Field\n\n'
              'from .base import FrozenModel\n\n\n'
              + blocks(('_utcnow', 'QuarantineScope', 'QuarantineBatch'))
              + '\n__all__ = ["QuarantineBatch", "QuarantineScope"]\n',
              encoding='utf-8',
          )
          subprocess.run(['git', 'rm', str(operations_path)], check=True)

          target = contracts / 'target_operation.py'
          text = target.read_text(encoding='utf-8')
          text = text.replace('from .config import FrozenModel', 'from .base import FrozenModel')
          text = text.replace('from .contracts.recovery import UnknownOutcomeResolution', 'from .recovery import UnknownOutcomeResolution')
          target.write_text(text, encoding='utf-8')

          # Move the generic immutable model base out of config. Keep it private inside config
          # so the old config.FrozenModel name does not survive as an accidental alias.
          config = pkg / 'config.py'
          text = config.read_text(encoding='utf-8')
          text = text.replace(
              'from pydantic import BaseModel, ConfigDict, Field, model_validator',
              'from pydantic import Field, model_validator',
          )
          text = text.replace(
              'from .schema_contract import SchemaContract',
              'from .contracts.base import FrozenModel as _FrozenModel\nfrom .contracts.schema import SchemaContract',
          )
          text = re.sub(
              r'\nclass FrozenModel\(BaseModel\):\n'
              r'    """Base model for immutable, strict framework contracts\."""\n\n'
              r'    model_config = ConfigDict\(frozen=True, extra="forbid", str_strip_whitespace=True\)\n',
              '', text,
          )
          text = re.sub(r'class ([A-Za-z_][A-Za-z0-9_]*)\(FrozenModel\):', r'class \1(_FrozenModel):', text)
          config.write_text(text, encoding='utf-8')

          deployment_contracts = pkg / 'deployment' / 'contracts.py'
          text = deployment_contracts.read_text(encoding='utf-8')
          text = text.replace(
              'from pydantic import BaseModel, ConfigDict, Field, model_validator',
              'from pydantic import Field, model_validator',
          )
          text = text.replace(
              'from ..control_plane.schema import ENVIRONMENT_LOCAL_STATE_TABLES, PROMOTABLE_DEFINITION_TABLES',
              'from ..contracts.base import FrozenModel\nfrom ..control_plane.schema import ENVIRONMENT_LOCAL_STATE_TABLES, PROMOTABLE_DEFINITION_TABLES',
          )
          text = re.sub(
              r'\nclass FrozenModel\(BaseModel\):\n'
              r'    model_config = ConfigDict\(frozen=True, extra="forbid", str_strip_whitespace=True\)\n',
              '', text,
          )
          deployment_contracts.write_text(text, encoding='utf-8')

          operation_owner = {
              'StepStatus': 'audit', 'RowAccounting': 'audit', 'MutationCounts': 'audit',
              'PipelineRunAudit': 'audit', 'DatasetRunAudit': 'audit', 'StepRunAudit': 'audit',
              'ReconciliationStatus': 'reconciliation', 'ReconciliationMetric': 'reconciliation',
              'ReconciliationResult': 'reconciliation', 'QuarantineScope': 'quarantine',
              'QuarantineBatch': 'quarantine',
          }
          facade_owner = {
              'CaptureReceipt': 'capture_receipt',
              'DatasetDispatchOutcome': 'dispatch', 'DatasetDispatchRequest': 'dispatch',
              'ExecutionKind': 'execution_plan', 'ExecutionPlan': 'execution_plan',
              'ExecutionRole': 'execution_plan', 'ExecutionUnit': 'execution_plan',
              'build_default_execution_plan': 'execution_plan', 'compile_execution_plan': 'execution_plan',
              'FullRebuildStateAdapter': 'rebuild', 'FullRebuildStateReplacement': 'rebuild',
              'FullRebuildStateSnapshot': 'rebuild', 'RebuildProgressKind': 'rebuild',
              'DatasetAttemptLineage': 'recovery', 'ReprocessRequest': 'recovery',
              'ReprocessRequestStatus': 'recovery', 'UnknownOutcomeResolution': 'recovery',
              'QuarantineBatchEvidence': 'replay', 'QuarantineReplayPayload': 'replay',
              'QuarantineReplayPayloadProvider': 'replay', 'QuarantineReplayPlan': 'replay',
          }

          def resolve_import(path: Path, node: ast.ImportFrom) -> str:
              module = node.module or ''
              if node.level == 0:
                  return module
              try:
                  rel_parent = path.parent.relative_to(pkg)
              except ValueError:
                  return module
              package_parts = ['fabric_data_framework', *rel_parent.parts]
              up = node.level - 1
              if up > len(package_parts) - 1:
                  return module
              base = package_parts[: len(package_parts) - up]
              return '.'.join([*base, *module.split('.')]) if module else '.'.join(base)

          def render(module: str, aliases: list[ast.alias]) -> str:
              names = [a.name + (f' as {a.asname}' if a.asname else '') for a in aliases]
              if len(names) == 1:
                  return f'from {module} import {names[0]}\n'
              return f'from {module} import (\n' + ''.join(f'    {name},\n' for name in names) + ')\n'

          def rewrite(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  return
              lines = text.splitlines(keepends=True)
              changes: list[tuple[int, int, str]] = []
              for node in tree.body:
                  if not isinstance(node, ast.ImportFrom) or node.end_lineno is None:
                      continue
                  resolved = resolve_import(path, node)
                  groups: dict[str, list[ast.alias]] = defaultdict(list)

                  if resolved == 'fabric_data_framework.operations':
                      for alias in node.names:
                          owner = operation_owner.get(alias.name)
                          if owner is None:
                              raise RuntimeError(f'unknown operations symbol {alias.name} in {path}')
                          groups[f'fabric_data_framework.contracts.{owner}'].append(alias)
                  elif resolved == 'fabric_data_framework.schema_contract':
                      groups['fabric_data_framework.contracts.schema'].extend(node.names)
                  elif resolved == 'fabric_data_framework.target_operations':
                      groups['fabric_data_framework.contracts.target_operation'].extend(node.names)
                  elif resolved == 'fabric_data_framework.contracts':
                      for alias in node.names:
                          owner = facade_owner.get(alias.name)
                          if owner is None:
                              raise RuntimeError(f'unknown contracts facade symbol {alias.name} in {path}')
                          groups[f'fabric_data_framework.contracts.{owner}'].append(alias)
                  elif resolved == 'fabric_data_framework.config' and any(a.name == 'FrozenModel' for a in node.names):
                      remaining = [a for a in node.names if a.name != 'FrozenModel']
                      frozen = [a for a in node.names if a.name == 'FrozenModel']
                      if remaining:
                          groups['fabric_data_framework.config'].extend(remaining)
                      groups['fabric_data_framework.contracts.base'].extend(frozen)
                  else:
                      continue

                  replacement = ''.join(render(module, aliases) for module, aliases in sorted(groups.items()))
                  changes.append((node.lineno - 1, node.end_lineno, replacement))

              for start, end, replacement in sorted(changes, reverse=True):
                  lines[start:end] = [replacement]
              if changes:
                  path.write_text(''.join(lines), encoding='utf-8')

          skip = {
              config.resolve(), deployment_contracts.resolve(), target.resolve(),
              (contracts / 'audit.py').resolve(), (contracts / 'reconciliation.py').resolve(),
              (contracts / 'quarantine.py').resolve(), (contracts / 'schema.py').resolve(),
              (contracts / 'base.py').resolve(), (contracts / '__init__.py').resolve(),
          }
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path.resolve() not in skip:
                      rewrite(path)

          (contracts / '__init__.py').write_text(
              '"""Provider-neutral framework contracts.\n\n'
              'Import concrete contracts from explicit submodules. The package root deliberately\n'
              'has no eager re-export API.\n'
              '"""\n', encoding='utf-8',
          )
          (contracts / 'README.md').write_text(
              '# Contracts package\n\n'
              'Provider-neutral immutable contracts and semantic state machines live here.\n\n'
              '```text\n'
              'base.py              immutable strict Pydantic base\n'
              'schema.py            schema intent and compatibility policy\n'
              'audit.py             pipeline/dataset/step audit models\n'
              'reconciliation.py    reconciliation result models\n'
              'quarantine.py        quarantine batch models\n'
              'target_operation.py  semantic target-mutation identity/lifecycle\n'
              'capture_receipt.py   capture handoff receipt\n'
              'dispatch.py          orchestration request/outcome\n'
              'execution_plan.py    execution plan contracts\n'
              'rebuild.py           rebuild-state contracts\n'
              'recovery.py          retry/reprocess/unknown-outcome contracts\n'
              'replay.py            quarantine replay contracts\n'
              '```\n\n'
              'Use explicit submodule imports; `contracts/__init__.py` is namespace-only.\n',
              encoding='utf-8',
          )

          boundary = root / 'tests' / 'test_semantic_contract_package_boundary.py'
          boundary.write_text('''from __future__ import annotations\n\nimport ast\nimport importlib\nfrom pathlib import Path\n\nimport pytest\n\n\nREPO_ROOT = Path(__file__).parents[1]\nPACKAGE_ROOT = REPO_ROOT / "src" / "fabric_data_framework"\nCONTRACTS_ROOT = PACKAGE_ROOT / "contracts"\n\n\ndef test_semantic_contracts_have_explicit_canonical_modules():\n    package = importlib.import_module("fabric_data_framework.contracts")\n    assert importlib.import_module("fabric_data_framework.contracts.schema").SchemaContract\n    assert importlib.import_module("fabric_data_framework.contracts.audit").DatasetRunAudit\n    assert importlib.import_module("fabric_data_framework.contracts.reconciliation").ReconciliationResult\n    assert importlib.import_module("fabric_data_framework.contracts.quarantine").QuarantineBatch\n    assert importlib.import_module("fabric_data_framework.contracts.target_operation").TargetOperationIntent\n    assert not hasattr(package, "CaptureReceipt")\n    assert not hasattr(package, "SchemaContract")\n\n\n@pytest.mark.parametrize("module_name", ("schema_contract", "operations", "target_operations"))\ndef test_removed_root_semantic_contract_modules_do_not_resolve(module_name: str):\n    assert not (PACKAGE_ROOT / f"{module_name}.py").exists()\n    with pytest.raises(ModuleNotFoundError):\n        importlib.import_module(f"fabric_data_framework.{module_name}")\n\n\ndef test_contracts_package_root_has_no_reexport_imports():\n    tree = ast.parse((CONTRACTS_ROOT / "__init__.py").read_text(encoding="utf-8"))\n    assert not any(isinstance(node, (ast.Import, ast.ImportFrom)) for node in tree.body)\n\n\ndef test_config_no_longer_owns_frozen_model():\n    config = importlib.import_module("fabric_data_framework.config")\n    base = importlib.import_module("fabric_data_framework.contracts.base")\n    assert hasattr(base, "FrozenModel")\n    assert not hasattr(config, "FrozenModel")\n\n\ndef _resolve(path: Path, node: ast.ImportFrom) -> str:\n    module = node.module or ""\n    if node.level == 0:\n        return module\n    try:\n        rel_parent = path.parent.relative_to(PACKAGE_ROOT)\n    except ValueError:\n        return module\n    parts = ["fabric_data_framework", *rel_parent.parts]\n    up = node.level - 1\n    base = parts[: len(parts) - up]\n    return ".".join([*base, *module.split(".")]) if module else ".".join(base)\n\n\ndef test_source_and_tests_use_explicit_contract_submodules():\n    forbidden = {\n        "fabric_data_framework.schema_contract",\n        "fabric_data_framework.operations",\n        "fabric_data_framework.target_operations",\n        "fabric_data_framework.contracts",\n    }\n    offenders: list[str] = []\n    current = Path(__file__).resolve()\n    for root in (REPO_ROOT / "src", REPO_ROOT / "tests"):\n        for path in sorted(root.rglob("*.py")):\n            if path.resolve() == current or path == CONTRACTS_ROOT / "__init__.py":\n                continue\n            tree = ast.parse(path.read_text(encoding="utf-8"))\n            for node in ast.walk(tree):\n                if isinstance(node, ast.ImportFrom):\n                    resolved = _resolve(path, node)\n                    if resolved in forbidden:\n                        offenders.append(f"{path.relative_to(REPO_ROOT)}: {resolved}")\n                    if resolved == "fabric_data_framework.config" and any(\n                        alias.name == "FrozenModel" for alias in node.names\n                    ):\n                        offenders.append(f"{path.relative_to(REPO_ROOT)}: config.FrozenModel")\n                elif isinstance(node, ast.Import):\n                    for alias in node.names:\n                        if alias.name in forbidden - {"fabric_data_framework.contracts"}:\n                            offenders.append(f"{path.relative_to(REPO_ROOT)}: {alias.name}")\n    assert offenders == []\n''', encoding='utf-8')

          for path in (
              pkg / 'README.md',
              root / 'docs' / 'human' / 'REPOSITORY_GUIDE.md',
              root / 'docs' / 'machine' / 'IMPLEMENTATION_MAP.md',
          ):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('`schema_contract.py`', '`contracts/schema.py`')
              text = text.replace('`target_operations.py`', '`contracts/target_operation.py`')
              text = text.replace('`operations.py`', '`contracts/audit.py`, `contracts/reconciliation.py`, `contracts/quarantine.py`')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Verify architecture before committing. Local modules such as
          # fabric_data_framework.deployment.contracts are intentionally allowed.
          forbidden = {
              'fabric_data_framework.schema_contract',
              'fabric_data_framework.operations',
              'fabric_data_framework.target_operations',
              'fabric_data_framework.contracts',
          }
          offenders: list[str] = []
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path == boundary or path == contracts / '__init__.py':
                      continue
                  tree = ast.parse(path.read_text(encoding='utf-8'))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom):
                          resolved = resolve_import(path, node)
                          if resolved in forbidden:
                              offenders.append(f'{path}: {resolved}')
                          if resolved == 'fabric_data_framework.config' and any(a.name == 'FrozenModel' for a in node.names):
                              offenders.append(f'{path}: config.FrozenModel')
                      elif isinstance(node, ast.Import):
                          for alias in node.names:
                              if alias.name in forbidden - {'fabric_data_framework.contracts'}:
                                  offenders.append(f'{path}: {alias.name}')
          if offenders:
              raise RuntimeError('legacy semantic contract imports remain:\n' + '\n'.join(offenders))

          config_tree = ast.parse(config.read_text(encoding='utf-8'))
          if any(isinstance(node, ast.Name) and node.id == 'FrozenModel' for node in ast.walk(config_tree)):
              raise RuntimeError('config.py still owns or references public FrozenModel')

          (root / '.github' / 'workflows' / 'refactor-semantic-contracts-v2.yml').unlink()
          PY
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: extract explicit semantic contract modules"
          git push origin HEAD:codex/semantic-contracts-package-v2
