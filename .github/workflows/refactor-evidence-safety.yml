name: refactor-evidence-safety

on:
  push:
    branches:
      - codex/evidence-safety-canonical

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/evidence-safety-canonical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Move retained evidence safety into evidence package
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          pkg = root / 'src' / 'fabric_data_framework'
          old = pkg / 'retained_evidence_safety.py'
          new = pkg / 'evidence' / 'safety.py'
          subprocess.run(['git', 'mv', str(old), str(new)], check=True)

          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace(
                      'from fabric_data_framework.retained_evidence_safety import ',
                      'from fabric_data_framework.evidence.safety import ',
                  )
                  if path.parent == pkg / 'evidence':
                      updated = updated.replace(
                          'from ..retained_evidence_safety import ',
                          'from .safety import ',
                      )
                  else:
                      updated = updated.replace(
                          'from .retained_evidence_safety import ',
                          'from .evidence.safety import ',
                      )
                      updated = updated.replace(
                          'from ..retained_evidence_safety import ',
                          'from ..evidence.safety import ',
                      )
                  updated = updated.replace(
                      'import fabric_data_framework.retained_evidence_safety',
                      'import fabric_data_framework.evidence.safety',
                  )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          boundary = root / 'tests' / 'test_evidence_safety_boundary.py'
          boundary.write_text('''from __future__ import annotations\n\nimport importlib\nfrom pathlib import Path\n\nimport pytest\n\n\nREPO_ROOT = Path(__file__).parents[1]\nPACKAGE_ROOT = REPO_ROOT / "src" / "fabric_data_framework"\n\n\ndef test_evidence_safety_has_one_canonical_module_path():\n    module = importlib.import_module("fabric_data_framework.evidence.safety")\n    assert callable(module.assert_safe_retained_text)\n    assert not (PACKAGE_ROOT / "retained_evidence_safety.py").exists()\n    with pytest.raises(ModuleNotFoundError):\n        importlib.import_module("fabric_data_framework.retained_evidence_safety")\n\n\ndef test_source_and_tests_do_not_reintroduce_old_evidence_safety_import():\n    forbidden = "fabric_data_framework.retained_evidence_safety"\n    offenders: list[str] = []\n    current_test = Path(__file__).resolve()\n    for root in (REPO_ROOT / "src", REPO_ROOT / "tests"):\n        for path in sorted(root.rglob("*.py")):\n            if path.resolve() == current_test:\n                continue\n            if forbidden in path.read_text(encoding="utf-8"):\n                offenders.append(str(path.relative_to(REPO_ROOT)))\n    assert offenders == []\n''', encoding='utf-8')

          evidence_readme = pkg / 'evidence' / 'README.md'
          text = evidence_readme.read_text(encoding='utf-8')
          if 'safety.py' not in text:
              text += '\n`evidence/safety.py` owns fail-closed validation for text retained as integration evidence.\n'
              evidence_readme.write_text(text, encoding='utf-8')

          for path in (
              pkg / 'README.md',
              root / 'docs' / 'machine' / 'IMPLEMENTATION_MAP.md',
          ):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('`retained_evidence_safety.py`', '`evidence/safety.py`')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          offenders = []
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path == boundary:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if 'retained_evidence_safety' in text:
                      offenders.append(str(path))
          if offenders:
              raise RuntimeError('old evidence safety path remains:\n' + '\n'.join(offenders))

          (root / '.github' / 'workflows' / 'refactor-evidence-safety.yml').unlink()
          PY
      - name: Commit canonical evidence safety move
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: move retained evidence safety into evidence package"
          git push origin HEAD:codex/evidence-safety-canonical
