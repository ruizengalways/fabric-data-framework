name: tmp-fix-projection-runtime

on:
  push:
    branches:
      - fix/finish-current-projection-production
    paths:
      - .github/workflows/tmp-fix-projection-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/finish-current-projection-production
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python tmp_fix_projection_runtime.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework/adapters/fabric/current_projection.py src/fabric_data_framework/execution/backends/fabric_spark.py src/fabric_data_framework/control_plane/current_projection_transition.py src/fabric_data_framework/control_plane/dataset_lease_recovery.py tests/test_current_projection_production_runtime.py
          git commit -m "Fix projection runtime verification and persisted timestamps"
          git push origin HEAD:fix/finish-current-projection-production
