name: refactor-clean-current-docs

on:
  push:
    branches:
      - codex/remove-evidence-legacy-paths

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-evidence-legacy-paths
          fetch-depth: 0
      - name: Remove stale compatibility wording
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          human = root / 'docs/human/REPOSITORY_GUIDE.md'
          text = human.read_text(encoding='utf-8')
          old = '''根目录仍然保留例如：\n\n```text\nintegration_evidence.py\nintegration_runner.py\napproved_capture_runner.py\napproved_warehouse_runner.py\n```\n\n这些现在只是 deprecated compatibility alias。它们和 `evidence/` 中的 canonical module 指向同一个 module object，确保已有 import/monkeypatch 不因为整理目录而突然失效。**不要再往这些根目录 shim 里新增 implementation。**\n'''
          new = '''Evidence 只有一个 import surface：`fabric_data_framework.evidence`。根目录不再保留 `integration_*` 或 `approved_*_runner.py` alias；旧 import 应直接迁移到 canonical evidence 路径。\n'''
          if old not in text:
              raise RuntimeError('human legacy evidence block not found')
          text = text.replace(old, new)
          text = text.replace(
              '`cli_router.py` 只保留为旧 import 的 deprecated compatibility shim；实际 CLI implementation 不再放在顶层。',
              '`cli_router.py` 已删除；CLI 只通过 `fabric_data_framework.cli` 暴露和实现。',
          )
          text = text.replace(
              'legacy evidence import == canonical evidence module',
              'legacy evidence import path must not resolve',
          )
          human.write_text(text, encoding='utf-8')

          impl = root / 'docs/machine/IMPLEMENTATION_MAP.md'
          text = impl.read_text(encoding='utf-8')
          text = text.replace(
              'Historical root modules named `integration_evidence.py`, `integration_checks.py`, `integration_evidence_merge.py`, and `integration_runner.py` are compatibility aliases only. New implementation belongs under `evidence/`.',
              'Root-level `integration_*` evidence modules are intentionally absent. `evidence/` is the only import and implementation surface.',
          )
          text = text.replace(
              'Historical root `approved_*_runner.py` modules are compatibility aliases to these canonical modules and contain no business implementation.',
              'Root-level `approved_*_runner.py` modules are intentionally absent; approved runners are imported only from `fabric_data_framework.evidence`.',
          )
          text = text.replace(
              'legacy evidence import resolving to the same canonical module object\nroot evidence compatibility modules containing no implementation',
              'legacy evidence import paths failing to resolve\nroot evidence legacy module files remaining absent',
          )
          impl.write_text(text, encoding='utf-8')

          cli_test = root / 'tests/test_cli_isolation.py'
          text = cli_test.read_text(encoding='utf-8')
          text = text.replace(
              '        if "cli" in relative.parts or relative.name == "cli_router.py":\n',
              '        if "cli" in relative.parts:\n',
          )
          cli_test.write_text(text, encoding='utf-8')

          # Final-tree sanity: current navigation docs must not describe removed aliases as supported.
          for path in (human, impl, root / 'src/fabric_data_framework/README.md', root / 'src/fabric_data_framework/evidence/README.md'):
              current = path.read_text(encoding='utf-8')
              for phrase in ('compatibility aliases only', 'deprecated compatibility alias', 'remain compatibility aliases'):
                  if phrase in current:
                      raise RuntimeError(f'stale compatibility wording remains in {path}: {phrase}')

          (root / '.github/workflows/refactor-clean-current-docs.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: remove stale legacy compatibility guidance"
          git push origin HEAD:codex/remove-evidence-legacy-paths
