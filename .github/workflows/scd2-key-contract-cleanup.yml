name: scd2-key-contract-cleanup

on:
  push:
    branches: [fix/scd2-key-contract]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/scd2-key-contract
      - name: Finalize state and remove temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/internal/STATE.md')
          text = path.read_text(encoding='utf-8')
          assert 'updated: 2026-09-09' in text
          text = text.replace('updated: 2026-09-09', 'updated: 2026-09-11', 1)

          old = '''`0.4.0` is not frozen and not release-authorized. The exact post-refactor executable candidate is selected, but release certification remains blocked at the external live-Fabric binding/evidence boundary.\n\nAny packaged-code change invalidates this executable candidate and requires a new exact main wheel. A docs/test-only bookkeeping merge after candidate selection does not change selected wheel bytes. Release promotion must use the exact already-built/certified wheel bytes; no release-time rebuild.\n'''
          new = '''`0.4.0` is not frozen and not release-authorized. The previously selected post-refactor executable candidate is superseded by the packaged SCD2 key-contract repair, so there is currently no exact current-source candidate. After this repair reaches `main`, both post-merge gates must pass and the retained main wheel must be independently verified before a new candidate is recorded.\n\nAny packaged-code change invalidates a selected executable candidate and requires a new exact main wheel. A docs/test-only bookkeeping merge after candidate selection does not change selected wheel bytes. Release promotion must use the exact already-built/certified wheel bytes; no release-time rebuild.\n'''
          assert old in text, 'release-boundary anchor changed'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/scd2-key-contract-finalizer.yml \
                 .github/workflows/scd2-key-contract-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/internal/STATE.md
          git commit -m "chore: finalize SCD2 key-contract repair"
          git push origin HEAD:fix/scd2-key-contract
