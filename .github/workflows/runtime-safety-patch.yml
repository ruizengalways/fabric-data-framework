name: runtime-safety-patch

on:
  push:
    branches:
      - fix/runtime-safety-hardening
    paths:
      - .github/scripts/runtime_safety_patch.py
      - .github/workflows/runtime-safety-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-safety-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/runtime_safety_patch.py
      - name: Commit generated edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework/control_plane/sqlalchemy_repository.py src/fabric_data_framework/execution/watermark_scd2.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: harden watermark persistence and CAS"
            git push origin HEAD:fix/runtime-safety-hardening
          fi
