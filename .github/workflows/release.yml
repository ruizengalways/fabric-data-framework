name: framework-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install and validate tag
        run: |
          python -m pip install -e ".[dev]"
          fabric-framework validate-tag --tag "${GITHUB_REF_NAME}"
          ruff check --isolated --select E4,E7,E9,F src tests
          pytest -q
      - name: Build immutable wheel and checksum
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          sha256sum dist/*.whl | tee dist/SHA256SUMS
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; immutable release overwrite refused." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "fabric-data-framework ${GITHUB_REF_NAME}" \
            --generate-notes
