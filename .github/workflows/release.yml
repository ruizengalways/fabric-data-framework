name: framework-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release, for example 0.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: framework-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve immutable release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Manual releases must run from the main branch; selected ref is ${GITHUB_REF}." >&2
              exit 1
            fi
            if [ -z "${INPUT_VERSION}" ]; then
              echo "Manual release version is required." >&2
              exit 1
            fi
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved immutable release tag: ${TAG}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install and validate release candidate
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python -m pip install -e ".[dev]"
          fabric-framework validate-tag --tag "${RELEASE_TAG}"
          ruff check --isolated --select E4,E7,E9,F src tests
          python -m compileall -q src tests
          python -m pip check
          pytest -q

      - name: Refuse existing tag or release for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; immutable release creation refused." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable release overwrite refused." >&2
            exit 1
          fi

      - name: Build immutable wheel and checksum
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          (cd dist && sha256sum *.whl | tee SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Refuse existing release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable release overwrite refused." >&2
            exit 1
          fi

      - name: Create immutable tag for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "fabric-data-framework ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --title "fabric-data-framework ${RELEASE_TAG}" \
            --generate-notes
