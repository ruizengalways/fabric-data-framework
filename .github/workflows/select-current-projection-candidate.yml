name: select-current-projection-candidate

on:
  push:
    branches:
      - docs/select-current-projection-candidate
    paths:
      - .github/workflows/select-current-projection-candidate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/select-current-projection-candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Record exact selected candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('docs/internal/STATE.md')
          state = state_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          state = replace_once(state, 'updated: 2026-09-11', 'updated: 2026-09-12', 'state updated date')
          state = replace_once(state, '  exact_candidate_source_selected: false', '  exact_candidate_source_selected: true', 'selected flag')
          state = replace_once(state, '  current_source_candidate_git_sha: not_selected_after_current_projection_feature', '  current_source_candidate_git_sha: ec4b211f5d6545de646f0b0e217e31a403acaf19', 'current source sha')
          state = replace_once(state, '  current_source_framework_artifact_sha256: not_selected_after_current_projection_feature', '  current_source_framework_artifact_sha256: 74ba62380bf132ede70f77fb4b1c2410cab531bee2d1f00be27fd03821c91e64', 'current wheel sha')
          state = replace_once(state, '  current_source_requires_new_exact_artifact_before_release_claim: true', '  current_source_requires_new_exact_artifact_before_release_claim: false', 'new artifact flag')
          state = replace_once(state, '  candidate_bytes_must_not_change: false', '  candidate_bytes_must_not_change: true', 'immutable candidate flag')

          selected_re = re.compile(
              r'  selected_candidate:\n.*?(?=  superseded_scd2_key_contract_candidate:)',
              re.S,
          )
          selected = '''  selected_candidate:\n    candidate_git_sha: ec4b211f5d6545de646f0b0e217e31a403acaf19\n    candidate_main_framework_ci_run: 34656625530\n    candidate_main_installed_wheel_run: 34656625496\n    candidate_wheel_artifact_id: 10285761216\n    candidate_wheel_artifact_name: framework-wheel-ec4b211f5d6545de646f0b0e217e31a403acaf19\n    candidate_wheel_filename: fabric_data_framework-0.4.0-py3-none-any.whl\n    framework_artifact_sha256: 74ba62380bf132ede70f77fb4b1c2410cab531bee2d1f00be27fd03821c91e64\n    wheel_sha_verified_against_candidate_json: true\n    wheel_sha_verified_against_sha256sums: true\n    wheel_sha_independently_rehashed: true\n    status: selected_not_frozen\n  superseded_runtime_safety_candidate:\n    candidate_git_sha: b1b69c6ecd465b63c7e83d8405733a0c34962c8c\n    candidate_main_framework_ci_run: 34595385389\n    candidate_main_installed_wheel_run: 34595385353\n    candidate_wheel_artifact_id: 10261562203\n    candidate_wheel_artifact_name: framework-wheel-b1b69c6ecd465b63c7e83d8405733a0c34962c8c\n    candidate_wheel_filename: fabric_data_framework-0.4.0-py3-none-any.whl\n    framework_artifact_sha256: 3bfa738f63ae2b85228174dcd4b0949618d4e3f52212e8dc1deae01465860ab2\n    wheel_sha_verified_against_candidate_json: true\n    wheel_sha_verified_against_sha256sums: true\n    wheel_sha_independently_rehashed: true\n    status: superseded_by_current_projection_feature\n'''
          state, count = selected_re.subn(selected, state, count=1)
          if count != 1:
              raise SystemExit(f'selected candidate block: expected one match, found {count}')

          state = replace_once(state, '  exact_current_candidate_selected: false', '  exact_current_candidate_selected: true', 'fabric proof selected flag')
          state = replace_once(
              state,
              '  current_source_installed_wheel_acceptance: not_run_for_new_current_source',
              '  current_source_installed_wheel_acceptance: passed_main_run_34656625496',
              'installed wheel proof',
          )

          old_next = '''next_boundary:\n  - merge current/history projection semantics only after exact PR-head framework and installed-wheel gates pass\n  - build and retain the exact post-merge main wheel and independently verify its inner SHA256\n  - select the new exact executable candidate before any live Fabric certification\n'''
          new_next = '''next_boundary:\n  - keep the exact selected candidate bytes immutable while Fabric certification is pending\n'''
          state = replace_once(state, old_next, new_next, 'next boundary')

          selected_section = '''## Selected current-projection candidate\n\nThe current/history projection feature merged on `main` at:\n\n```text\nec4b211f5d6545de646f0b0e217e31a403acaf19\n```\n\nThe exact post-merge main gates are:\n\n```text\nframework-ci               34656625530  PASS\ninstalled-wheel-acceptance 34656625496  PASS\n```\n\nThe retained framework-ci artifact is:\n\n```text\nartifact id    10285761216\nartifact name  framework-wheel-ec4b211f5d6545de646f0b0e217e31a403acaf19\nwheel          fabric_data_framework-0.4.0-py3-none-any.whl\n```\n\nThe **inner wheel bytes**, not the outer GitHub Actions artifact ZIP, were independently SHA256-hashed after download. The digest exactly matches both `CANDIDATE.json` and `SHA256SUMS`:\n\n```text\nframework_artifact_sha256\n= 74ba62380bf132ede70f77fb4b1c2410cab531bee2d1f00be27fd03821c91e64\n```\n\nThis exact executable candidate is **selected but not frozen**. It has not yet constructed `integration_inputs_hash`, executed Microsoft Fabric, authorized release, or claimed Fabric PASS. Candidate/evidence identity remains `framework_artifact_sha256 + integration_inputs_hash`; `integration_inputs_hash` is still not yet constructed. The selected wheel bytes must not change before identity-bound Fabric certification; any packaged runtime change requires a new exact candidate.\n\n'''
          state = replace_once(
              state,
              '## Superseded runtime-safety candidate\n',
              selected_section + '## Superseded runtime-safety candidate\n',
              'selected candidate section',
          )
          state_path.write_text(state, encoding='utf-8')

          test_path = Path('tests/test_current_docs_consistency.py')
          test = test_path.read_text(encoding='utf-8')
          replacements = {
              '"exact_candidate_source_selected: false"': '"exact_candidate_source_selected: true"',
              '"current_source_candidate_git_sha: not_selected_after_current_projection_feature"': '"current_source_candidate_git_sha: ec4b211f5d6545de646f0b0e217e31a403acaf19"',
              '"current_source_framework_artifact_sha256: not_selected_after_current_projection_feature"': '"current_source_framework_artifact_sha256: 74ba62380bf132ede70f77fb4b1c2410cab531bee2d1f00be27fd03821c91e64"',
              '"current_source_requires_new_exact_artifact_before_release_claim: true"': '"current_source_requires_new_exact_artifact_before_release_claim: false"',
              '"candidate_main_framework_ci_run: 34595385389"': '"candidate_main_framework_ci_run: 34656625530"',
              '"candidate_main_installed_wheel_run: 34595385353"': '"candidate_main_installed_wheel_run: 34656625496"',
              '"candidate_wheel_artifact_id: 10261562203"': '"candidate_wheel_artifact_id: 10285761216"',
              '"candidate_wheel_artifact_name: framework-wheel-b1b69c6ecd465b63c7e83d8405733a0c34962c8c"': '"candidate_wheel_artifact_name: framework-wheel-ec4b211f5d6545de646f0b0e217e31a403acaf19"',
              '"framework_artifact_sha256: 3bfa738f63ae2b85228174dcd4b0949618d4e3f52212e8dc1deae01465860ab2"': '"framework_artifact_sha256: 74ba62380bf132ede70f77fb4b1c2410cab531bee2d1f00be27fd03821c91e64"',
              '"exact_current_candidate_selected: false"': '"exact_current_candidate_selected: true"',
              '"current_source_installed_wheel_acceptance: not_run_for_new_current_source"': '"current_source_installed_wheel_acceptance: passed_main_run_34656625496"',
          }
          for old, new in replacements.items():
              test = replace_once(test, old, new, f'test token {old}')
          anchor = '        "wheel_sha_independently_rehashed: true",\n'
          if '        "status: selected_not_frozen",\n' not in test:
              test = replace_once(test, anchor, anchor + '        "status: selected_not_frozen",\n', 'selected status assertion')
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit candidate selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/STATE.md tests/test_current_docs_consistency.py
          git commit -m "docs: select exact current projection candidate"
          git push origin HEAD:docs/select-current-projection-candidate
