name: temporary-apply-unified-refactor

on:
  push:
    branches: [refactor/architecture-readability-boundaries]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/architecture-readability-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply unified certification refactor
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import runpy
          from pathlib import Path

          path = Path('tools/apply_unified_refactor.py')
          source = path.read_text(encoding='utf-8')
          module = ast.parse(source)
          values = {}
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {'UNIFIED', 'STAGES_PARTS'}:
                          values[target.id] = ast.literal_eval(node.value)
          correct = ""
          bad = values['STAGES_PARTS'][2]
          print('bad', hashlib.sha256(bad.encode()).hexdigest())
          print('correct', hashlib.sha256(correct.encode()).hexdigest())
          if hashlib.sha256(correct.encode()).hexdigest() != '9985335b96055fa176db51762f43b1c8e650b28c2da0559eebfa7153e388a0a4':
              raise SystemExit('embedded correction has wrong digest')
          source = source.replace(bad, correct, 1)
          path.write_text(source, encoding='utf-8')
          runpy.run_path(str(path), run_name='__main__')
          PY
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static and focused verification
        run: |
          ruff check src tests
          mypy \
            src/fabric_data_framework/contracts/runtime.py \
            src/fabric_data_framework/contracts/typed_values.py \
            src/fabric_data_framework/control_plane/repository.py \
            src/fabric_data_framework/recovery/runtime.py
          pytest -q \
            tests/test_unified_certification.py \
            tests/test_simple_certification.py \
            tests/test_evidence_safety_boundary.py \
            tests/test_evidence_import_smoke.py \
            tests/test_current_projection.py \
            tests/test_current_projection_production_runtime.py
          ruff check --isolated --select C901,PLR0913,PLR0915 \
            src/fabric_data_framework/certification/unified.py \
            src/fabric_data_framework/certification/unified_stages.py \
            src/fabric_data_framework/adapters/fabric/current_projection.py
      - name: Commit verified refactor
        run: |
          rm -rf src/fabric_data_framework.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor unified certification into typed stages'
          git push origin HEAD:refactor/architecture-readability-boundaries
