name: refactor-deployment-package

on:
  push:
    branches:
      - codex/deployment-package

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/deployment-package
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract canonical deployment package
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          pkg = root / 'src' / 'fabric_data_framework'

          # A file and directory cannot share the same name. Move the old module aside,
          # create the package, then move both implementation owners into explicit modules.
          temp_contracts = pkg / '_deployment_contracts_tmp.py'
          subprocess.run(['git', 'mv', str(pkg / 'deployment.py'), str(temp_contracts)], check=True)
          deployment = pkg / 'deployment'
          deployment.mkdir()
          subprocess.run(['git', 'mv', str(temp_contracts), str(deployment / 'contracts.py')], check=True)
          subprocess.run(['git', 'mv', str(pkg / 'delivery.py'), str(deployment / 'delivery.py')], check=True)

          contracts = deployment / 'contracts.py'
          text = contracts.read_text(encoding='utf-8')
          text = text.replace('from .control_plane.', 'from ..control_plane.')
          text = text.replace('from .infrastructure import ', 'from ..infrastructure import ')
          contracts.write_text(text, encoding='utf-8')

          delivery = deployment / 'delivery.py'
          text = delivery.read_text(encoding='utf-8')
          text = text.replace('from .config import ', 'from ..config import ')
          text = text.replace('from .control_plane.', 'from ..control_plane.')
          text = text.replace('from .deployment import ', 'from .contracts import ')
          delivery.write_text(text, encoding='utf-8')

          # Migrate every executable caller. The number of leading dots is preserved,
          # so callers at any package depth keep the same route back to package root.
          moved = {contracts.resolve(), delivery.resolve()}
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path.resolve() in moved:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = re.sub(
                      r'from (?P<dots>\.+)deployment import ',
                      lambda m: f"from {m.group('dots')}deployment.contracts import ",
                      text,
                  )
                  updated = re.sub(
                      r'from (?P<dots>\.+)delivery import ',
                      lambda m: f"from {m.group('dots')}deployment.delivery import ",
                      updated,
                  )
                  updated = updated.replace(
                      'from fabric_data_framework.deployment import ',
                      'from fabric_data_framework.deployment.contracts import ',
                  )
                  updated = updated.replace(
                      'from fabric_data_framework.delivery import ',
                      'from fabric_data_framework.deployment.delivery import ',
                  )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          (deployment / '__init__.py').write_text(
              '"""Canonical release/deployment package.\n\n'
              'Import immutable release/promotion contracts from ``deployment.contracts``\n'
              'and operational materialization helpers from ``deployment.delivery``.\n'
              'The package root deliberately does not recreate the former flat API.\n'
              '"""\n',
              encoding='utf-8',
          )
          (deployment / 'README.md').write_text(
              '# Deployment package\n\n'
              'This folder owns release identity, promotion/deployment contracts and the\n'
              'credential-free delivery/materialization helpers that operate on those contracts.\n\n'
              '```text\n'
              'contracts.py  immutable release identity, environment bindings, promotion plan, provenance\n'
              'delivery.py   config bundle/hash, release manifest I/O, semantic metadata materialization, deployment history\n'
              '```\n\n'
              'The package root intentionally has no compatibility re-exports. Use explicit\n'
              '`deployment.contracts` or `deployment.delivery` imports.\n',
              encoding='utf-8',
          )

          boundary = root / 'tests' / 'test_deployment_package_boundary.py'
          boundary.write_text('''from __future__ import annotations\n\nimport ast\nimport importlib\nfrom pathlib import Path\n\nimport pytest\n\n\nREPO_ROOT = Path(__file__).parents[1]\nPACKAGE_ROOT = REPO_ROOT / "src" / "fabric_data_framework"\nDEPLOYMENT_ROOT = PACKAGE_ROOT / "deployment"\n\n\ndef test_deployment_package_has_explicit_canonical_modules():\n    package = importlib.import_module("fabric_data_framework.deployment")\n    contracts = importlib.import_module("fabric_data_framework.deployment.contracts")\n    delivery = importlib.import_module("fabric_data_framework.deployment.delivery")\n    assert contracts.ReleaseManifest is not None\n    assert callable(delivery.build_release_manifest)\n    assert not hasattr(package, "ReleaseManifest")\n    assert not hasattr(package, "build_release_manifest")\n\n\ndef test_old_delivery_module_is_absent_and_deployment_file_became_package():\n    assert not (PACKAGE_ROOT / "delivery.py").exists()\n    assert not (PACKAGE_ROOT / "deployment.py").exists()\n    assert DEPLOYMENT_ROOT.is_dir()\n    with pytest.raises(ModuleNotFoundError):\n        importlib.import_module("fabric_data_framework.delivery")\n\n\ndef test_deployment_package_root_has_no_reexport_imports():\n    tree = ast.parse((DEPLOYMENT_ROOT / "__init__.py").read_text(encoding="utf-8"))\n    assert not any(isinstance(node, (ast.Import, ast.ImportFrom)) for node in tree.body)\n\n\ndef test_deployment_package_has_no_cli_dependency():\n    offenders: list[str] = []\n    for path in sorted(DEPLOYMENT_ROOT.rglob("*.py")):\n        text = path.read_text(encoding="utf-8")\n        if "fabric_data_framework.cli" in text or "from ..cli" in text:\n            offenders.append(str(path.relative_to(PACKAGE_ROOT)))\n    assert offenders == []\n\n\ndef test_source_and_tests_do_not_reintroduce_flat_delivery_or_deployment_symbol_imports():\n    forbidden = (\n        "from fabric_data_framework.delivery import",\n        "from fabric_data_framework.deployment import",\n    )\n    offenders: list[str] = []\n    current_test = Path(__file__).resolve()\n    for root in (REPO_ROOT / "src", REPO_ROOT / "tests"):\n        for path in sorted(root.rglob("*.py")):\n            if path.resolve() == current_test:\n                continue\n            text = path.read_text(encoding="utf-8")\n            for value in forbidden:\n                if value in text:\n                    offenders.append(f"{path.relative_to(REPO_ROOT)}: {value}")\n    assert offenders == []\n''', encoding='utf-8')

          # Update current navigation docs, not historical provenance text.
          for path in (
              pkg / 'README.md',
              root / 'docs' / 'human' / 'REPOSITORY_GUIDE.md',
              root / 'docs' / 'machine' / 'IMPLEMENTATION_MAP.md',
          ):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('`deployment.py`', '`deployment/contracts.py`')
              text = text.replace('`delivery.py`', '`deployment/delivery.py`')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Fail closed on import styles we intentionally do not support as aliases.
          offenders = []
          patterns = (
              re.compile(r'from \.+deployment import '),
              re.compile(r'from \.+delivery import '),
              re.compile(r'from fabric_data_framework\.deployment import '),
              re.compile(r'from fabric_data_framework\.delivery import '),
              re.compile(r'^\s*import fabric_data_framework\.delivery\b', re.MULTILINE),
              re.compile(r'^\s*from fabric_data_framework import delivery\b', re.MULTILINE),
          )
          for base in (pkg, root / 'tests'):
              for path in base.rglob('*.py'):
                  if path == boundary:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for pattern in patterns:
                      if pattern.search(text):
                          offenders.append(f'{path}: {pattern.pattern}')
          if offenders:
              raise RuntimeError('flat deployment/delivery imports remain:\n' + '\n'.join(offenders))

          (root / '.github' / 'workflows' / 'refactor-deployment-package.yml').unlink()
          PY
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: extract canonical deployment package"
          git push origin HEAD:codex/deployment-package
