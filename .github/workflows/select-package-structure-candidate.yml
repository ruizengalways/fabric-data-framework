name: select-package-structure-candidate

on:
  push:
    branches:
      - docs/select-package-structure-candidate

permissions:
  contents: write

jobs:
  select:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-state-selected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/select-package-structure-candidate
          fetch-depth: 0
      - name: Select exact post-refactor candidate in canonical state
        run: |
          python .github/select_package_structure_candidate.py
          if git diff --quiet; then
            echo "No candidate state change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/STATE.md tests/test_current_docs_consistency.py
          git commit -m "Record exact post-refactor candidate [candidate-state-selected]"
          git push origin HEAD:docs/select-package-structure-candidate
