name: select-scd2-key-fix-candidate

on:
  push:
    branches: [docs/select-scd2-key-fix-candidate]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/select-scd2-key-fix-candidate
      - name: Record verified exact candidate and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_sha = '81b574fb79bcc5e74cb9eee6d0644c6de8ef7ffd'
          wheel_sha = '5ee9a032d242f3a164ccfbfcfe5b646d91e6f35dbf603f21735b745dda6cead6'
          framework_run = '34565985394'
          installed_run = '34565985349'
          artifact_id = '10186013452'
          artifact_name = f'framework-wheel-{source_sha}'
          wheel_name = 'fabric_data_framework-0.4.0-py3-none-any.whl'

          state_path = Path('docs/internal/STATE.md')
          state = state_path.read_text(encoding='utf-8')

          replacements = {
              'exact_candidate_source_selected: false': 'exact_candidate_source_selected: true',
              'current_source_candidate_git_sha: not_selected_after_scd2_key_contract_change': f'current_source_candidate_git_sha: {source_sha}',
              'current_source_framework_artifact_sha256: not_selected_after_scd2_key_contract_change': f'current_source_framework_artifact_sha256: {wheel_sha}',
              'current_source_requires_new_exact_artifact_before_release_claim: true': 'current_source_requires_new_exact_artifact_before_release_claim: false',
              'candidate_bytes_must_not_change: false': 'candidate_bytes_must_not_change: true',
              '  exact_current_candidate_selected: false': '  exact_current_candidate_selected: true',
              '  current_source_installed_wheel_acceptance: not_run_for_new_source': '  current_source_installed_wheel_acceptance: passed',
          }
          for old, new in replacements.items():
              assert old in state, f'missing STATE anchor: {old}'
              state = state.replace(old, new, 1)

          marker = '  superseded_package_structure_candidate:\n'
          assert marker in state
          selected = f'''  selected_candidate:\n    candidate_git_sha: {source_sha}\n    candidate_main_framework_ci_run: {framework_run}\n    candidate_main_installed_wheel_run: {installed_run}\n    candidate_wheel_artifact_id: {artifact_id}\n    candidate_wheel_artifact_name: {artifact_name}\n    candidate_wheel_filename: {wheel_name}\n    framework_artifact_sha256: {wheel_sha}\n    wheel_sha_verified_against_candidate_json: true\n    wheel_sha_verified_against_sha256sums: true\n    wheel_sha_independently_rehashed: true\n    status: selected_not_frozen\n'''
          state = state.replace(marker, selected + marker, 1)

          old_next = '''next_boundary:\n  - after the SCD2 key-contract repair reaches main, select and independently verify the new exact main wheel\n  - record the new exact candidate provenance before any real Fabric certification\n  - obtain and live-verify the approved isolated DEV Fabric workspace/lakehouse identity and runtime credentials\n  - bootstrap/read back framework-owned certification assets using the exact selected wheel\n  - resolve exact item bindings by live Fabric item discovery\n  - construct and retain framework-owned integration inputs\n  - record integration_inputs_hash without guessing or substituting another identity\n  - install/attest the exact selected wheel in isolated DEV Fabric\n  - run certify_installed bounded first\n  - stop on any real FAIL\n  - run only explicitly required and authorized integration stages\n  - retain exact identity-bound evidence\n'''
          new_next = '''next_boundary:\n  - obtain and live-verify the approved isolated DEV Fabric workspace/lakehouse identity and runtime credentials\n  - bootstrap/read back framework-owned certification assets using the exact selected wheel\n  - resolve exact item bindings by live Fabric item discovery\n  - construct and retain framework-owned integration inputs\n  - record integration_inputs_hash without guessing or substituting another identity\n  - install/attest the exact selected wheel in isolated DEV Fabric\n  - run certify_installed bounded first\n  - stop on any real FAIL\n  - run only explicitly required and authorized integration stages\n  - retain exact identity-bound evidence\n'''
          assert old_next in state
          state = state.replace(old_next, new_next, 1)

          block = re.compile(
              r'## Current candidate state after the SCD2 key-contract repair\n.*?\n## Declarative reconciliation',
              re.S,
          )
          new_block = f'''## Selected exact current candidate after the SCD2 key-contract repair\n\nThe packaged SCD2 key-contract repair merged on `main` at:\n\n```text\n{source_sha}\n```\n\nThe exact post-merge main gates are:\n\n```text\nframework-ci               {framework_run}  PASS\ninstalled-wheel-acceptance {installed_run}  PASS\n```\n\nThe retained framework-ci artifact is:\n\n```text\nartifact id    {artifact_id}\nartifact name  {artifact_name}\nwheel          {wheel_name}\n```\n\nThe **inner wheel bytes**, not the outer GitHub Actions artifact ZIP, were independently SHA256-hashed after download. That digest exactly matches both `CANDIDATE.json` and `SHA256SUMS`:\n\n```text\nframework_artifact_sha256\n= {wheel_sha}\n```\n\nThis selects the exact executable candidate after the SCD2 key-contract repair. It does **not** freeze 0.4, construct integration inputs, execute Microsoft Fabric, authorize release, or claim Fabric PASS. Candidate/evidence identity remains `framework_artifact_sha256 + integration_inputs_hash`; `integration_inputs_hash` is still not yet constructed.\n\nFor SCD2, `business_key` remains the canonical entity identity. The shared `merge_key` field is still required by the current metadata shape but must equal `business_key`; divergent values fail closed during metadata validation.\n\nThe previous package-structure candidate at `8b118e9bf5c5132738eb1a486a6df3e6589cd16e` / `7ae26c3bef5cc5e5310c59c8f7182402ed26247b23c04cff4189250d8507e9a2` is historical provenance only.\n\n## Declarative reconciliation'''
          state, count = block.subn(new_block, state, count=1)
          assert count == 1, 'candidate narrative anchor changed'

          old_release = '''`0.4.0` is not frozen and not release-authorized. The previously selected post-refactor executable candidate is superseded by the packaged SCD2 key-contract repair, so there is currently no exact current-source candidate. After this repair reaches `main`, both post-merge gates must pass and the retained main wheel must be independently verified before a new candidate is recorded.\n'''
          new_release = '''`0.4.0` is not frozen and not release-authorized. The exact current executable candidate after the SCD2 key-contract repair is selected and independently verified, but release certification remains blocked at the external live-Fabric binding/evidence boundary.\n'''
          assert old_release in state
          state = state.replace(old_release, new_release, 1)
          state_path.write_text(state, encoding='utf-8')

          test_path = Path('tests/test_current_docs_consistency.py')
          text = test_path.read_text(encoding='utf-8')
          test_replacements = {
              '"exact_candidate_source_selected: false"': '"exact_candidate_source_selected: true"',
              '"current_source_candidate_git_sha: not_selected_after_scd2_key_contract_change"': f'"current_source_candidate_git_sha: {source_sha}"',
              '"current_source_framework_artifact_sha256: not_selected_after_scd2_key_contract_change"': f'"current_source_framework_artifact_sha256: {wheel_sha}"',
              '"current_source_requires_new_exact_artifact_before_release_claim: true"': '"current_source_requires_new_exact_artifact_before_release_claim: false"',
              '"exact_current_candidate_selected: false"': '"exact_current_candidate_selected: true"',
              '"current_source_installed_wheel_acceptance: not_run_for_new_source"': '"current_source_installed_wheel_acceptance: passed"',
          }
          for old, new in test_replacements.items():
              assert old in text, f'missing docs-test anchor: {old}'
              text = text.replace(old, new, 1)

          old_history_checks = '''        "candidate_main_framework_ci_run: 34347024953",\n        "candidate_main_installed_wheel_run: 34347025079",\n        "candidate_wheel_artifact_id: 10102117043",\n        "candidate_wheel_artifact_name: framework-wheel-8b118e9bf5c5132738eb1a486a6df3e6589cd16e",\n        "framework_artifact_sha256: 7ae26c3bef5cc5e5310c59c8f7182402ed26247b23c04cff4189250d8507e9a2",\n        "wheel_sha_independently_rehashed: true",\n        "status: superseded_by_scd2_key_contract_change",\n'''
          new_checks = f'''        "candidate_main_framework_ci_run: {framework_run}",\n        "candidate_main_installed_wheel_run: {installed_run}",\n        "candidate_wheel_artifact_id: {artifact_id}",\n        "candidate_wheel_artifact_name: {artifact_name}",\n        "framework_artifact_sha256: {wheel_sha}",\n        "wheel_sha_independently_rehashed: true",\n        "status: selected_not_frozen",\n        "candidate_git_sha: 8b118e9bf5c5132738eb1a486a6df3e6589cd16e",\n        "framework_artifact_sha256: 7ae26c3bef5cc5e5310c59c8f7182402ed26247b23c04cff4189250d8507e9a2",\n        "status: superseded_by_scd2_key_contract_change",\n'''
          assert old_history_checks in text
          text = text.replace(old_history_checks, new_checks, 1)
          test_path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/select-scd2-key-fix-candidate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/internal/STATE.md tests/test_current_docs_consistency.py
          git commit -m "docs: select exact SCD2 key-fix candidate"
          git push origin HEAD:docs/select-scd2-key-fix-candidate
