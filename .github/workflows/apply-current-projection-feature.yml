name: apply-current-projection-feature

on:
  push:
    branches:
      - feat/current-history-projections
    paths:
      - .github/scripts/apply_current_projection_feature.py
      - .github/workflows/apply-current-projection-feature.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/current-history-projections
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply feature patch
        run: python .github/scripts/apply_current_projection_feature.py
      - name: Commit feature integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework/metadata/config.py \
                  src/fabric_data_framework/metadata/capabilities.py \
                  src/fabric_data_framework/execution/plan_compiler.py \
                  src/fabric_data_framework/control_plane/schema.py \
                  src/fabric_data_framework/deployment/delivery.py \
                  src/fabric_data_framework/deployment/project.py \
                  tests/test_append_metadata.py \
                  tests/test_target_operation_journal.py \
                  tests/test_control_plane_certification.py \
                  tests/test_control_plane_certification_cli.py \
                  tests/test_current_docs_consistency.py \
                  docs/README.md README.md docs/internal/STATE.md
          git commit -m "feat: integrate current projections with metadata and ops"
          git push origin HEAD:feat/current-history-projections
