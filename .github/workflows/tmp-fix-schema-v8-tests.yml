name: tmp-fix-schema-v8-tests

on:
  push:
    branches:
      - fix/finish-current-projection-production
    paths:
      - .github/workflows/tmp-fix-schema-v8-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/finish-current-projection-production
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python tmp_fix_schema_v8_tests.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_append_metadata.py tests/test_control_plane_certification.py tests/test_control_plane_certification_cli.py tests/test_current_projection.py tests/test_target_operation_journal.py
          git commit -m "Update control-plane schema v8 test expectations"
          git push origin HEAD:fix/finish-current-projection-production
