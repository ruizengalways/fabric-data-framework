name: temporary-refactor-step

on:
  push:
    branches: [refactor/architecture-readability-boundaries]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/architecture-readability-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply one-shot refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_architecture_refactor_step1.py')
          text = path.read_text(encoding='utf-8')
          if text.endswith("\n'''\n"):
              path.write_text(text[:-5] + "\n", encoding='utf-8')
          PY
          python tools/apply_architecture_refactor_step1.py
          rm -f .github/workflows/refactor-step.yml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify focused boundary changes
        run: |
          ruff check src tests
          mypy \
            src/fabric_data_framework/contracts/runtime.py \
            src/fabric_data_framework/contracts/typed_values.py \
            src/fabric_data_framework/control_plane/repository.py \
            src/fabric_data_framework/recovery/runtime.py
          pytest -q tests/test_evidence_safety_boundary.py tests/test_current_projection.py tests/test_current_projection_production_runtime.py
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor provider-neutral safety and projection contracts [refactor-generated]'
          git push origin HEAD:refactor/architecture-readability-boundaries
