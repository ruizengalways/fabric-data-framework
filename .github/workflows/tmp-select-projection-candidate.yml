name: tmp-select-projection-candidate

on:
  push:
    branches:
      - docs/select-projection-production-candidate
    paths:
      - .github/workflows/tmp-select-projection-candidate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/select-projection-production-candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python tmp_select_projection_candidate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/STATE.md tests/test_current_docs_consistency.py
          git commit -m "Record exact projection-production candidate"
          git push origin HEAD:docs/select-projection-production-candidate
