name: candidate-business-path-evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful main framework-ci run that built the exact candidate wheel"
        required: true
        type: string
      candidate_git_sha:
        description: "Exact 40-character candidate source SHA; dispatch at this same ref"
        required: true
        type: string
      candidate_wheel_sha256:
        description: "Exact inner candidate wheel SHA256"
        required: true
        type: string
      integration_inputs_run_id:
        description: "Successful exact-candidate candidate-integration-inputs workflow run"
        required: true
        type: string
      integration_evidence_run_id:
        description: "Successful exact-candidate candidate-integration-evidence workflow run"
        required: true
        type: string
      environment:
        description: "Approved Fabric environment used by both retained artifacts"
        required: true
        default: DEV
        type: choice
        options: [DEV, UAT, PROD]
      business_path_plan_path:
        description: "Project-relative framework certification plan path"
        required: true
        default: "config/certification/business-path-plan.json"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: candidate-business-path-evidence-${{ inputs.candidate_git_sha }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_git_sha }}
      CANDIDATE_WHEEL_SHA256: ${{ inputs.candidate_wheel_sha256 }}
      INTEGRATION_INPUTS_RUN_ID: ${{ inputs.integration_inputs_run_id }}
      INTEGRATION_EVIDENCE_RUN_ID: ${{ inputs.integration_evidence_run_id }}
      CERTIFICATION_ENVIRONMENT: ${{ inputs.environment }}
      BUSINESS_PATH_PLAN_PATH: ${{ inputs.business_path_plan_path }}
      GH_TOKEN: ${{ github.token }}
      FABRIC_ACCESS_TOKEN: ${{ secrets.FABRIC_ACCESS_TOKEN }}
      CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
      WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
    steps:
      - name: Validate exact identities and dispatch ref
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          if re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE_SHA"]) is None:
              raise SystemExit("candidate_git_sha must be a 40-character lowercase git SHA")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["CANDIDATE_WHEEL_SHA256"]) is None:
              raise SystemExit("candidate_wheel_sha256 must be a 64-character lowercase SHA256")
          for name in ("CANDIDATE_RUN_ID", "INTEGRATION_INPUTS_RUN_ID", "INTEGRATION_EVIDENCE_RUN_ID"):
              value = os.environ[name]
              if not value.isdigit() or int(value) < 1:
                  raise SystemExit(f"{name} must be a positive GitHub Actions run ID")
          path = PurePosixPath(os.environ["BUSINESS_PATH_PLAN_PATH"])
          if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
              raise SystemExit("business_path_plan_path must be a safe project-relative path")
          if os.environ["GITHUB_SHA"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("candidate-business-path-evidence must be dispatched at the exact candidate ref")
          PY

      - name: Checkout exact framework candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_git_sha }}
          fetch-depth: 0

      - name: Verify candidate source and main CI provenance
        id: candidate
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          export RUN_JSON
          python - <<'PY'
          import json
          import os
          run = json.loads(os.environ["RUN_JSON"])
          if run["head_sha"] != os.environ["CANDIDATE_SHA"] or run["head_branch"] != "main":
              raise SystemExit("candidate CI does not bind exact main source SHA")
          if run["event"] != "push" or run["conclusion"] != "success" or run["path"] != ".github/workflows/ci.yml":
              raise SystemExit("candidate CI provenance is invalid")
          PY
          RUN_ATTEMPT="$(printf '%s' "${RUN_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["run_attempt"])')"
          echo "run_attempt=${RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Download and authenticate exact framework wheel
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: |
          rm -rf candidate-dist
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "framework-wheel-${CANDIDATE_SHA}" \
            --dir candidate-dist
          python src/fabric_data_framework/deployment/candidate_artifact.py verify \
            --dist-dir candidate-dist \
            --manifest candidate-dist/CANDIDATE.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --workflow-run-id "${CANDIDATE_RUN_ID}" \
            --workflow-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --expected-version "${FRAMEWORK_VERSION}" \
            --expected-wheel-sha256 "${CANDIDATE_WHEEL_SHA256}"
          (cd candidate-dist && sha256sum -c SHA256SUMS)

      - name: Verify integration input and evidence producer provenance
        run: |
          for pair in \
            "${INTEGRATION_INPUTS_RUN_ID}:.github/workflows/candidate-integration-inputs.yml" \
            "${INTEGRATION_EVIDENCE_RUN_ID}:.github/workflows/candidate-integration-evidence.yml"; do
            run_id="${pair%%:*}"
            expected_path="${pair#*:}"
            RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            export RUN_JSON expected_path
            python - <<'PY'
          import json
          import os
          run = json.loads(os.environ["RUN_JSON"])
          if run["head_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("retained producer candidate SHA mismatch")
          if run["event"] != "workflow_dispatch" or run["conclusion"] != "success":
              raise SystemExit("retained producer must be a successful workflow_dispatch")
          if run["path"] != os.environ["expected_path"]:
              raise SystemExit("retained producer workflow path mismatch")
          PY
          done

      - name: Download exact integration inputs and certified integration evidence
        run: |
          rm -rf integration-inputs retained
          mkdir -p integration-inputs retained/integration retained/gates retained/final
          gh run download "${INTEGRATION_INPUTS_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "integration-inputs-${CANDIDATE_SHA}-${CERTIFICATION_ENVIRONMENT}" \
            --dir integration-inputs
          gh run download "${INTEGRATION_EVIDENCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "integration-evidence-${CANDIDATE_SHA}-${CERTIFICATION_ENVIRONMENT}" \
            --dir retained/integration
          test -f integration-inputs/INPUTS.json
          test -f integration-inputs/release-manifest.json
          test -f integration-inputs/runner-config.json
          test -f retained/integration/integration-evidence.json
          test -f retained/integration/integration-spec.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install exact framework candidate
        run: |
          python -m pip install candidate-dist/*.whl
          python -m pip check

      - name: Validate exact input/evidence identity and business-path plan
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from fabric_data_framework.deployment.delivery import load_release_manifest
          from fabric_data_framework.evidence.business_path_driver import load_approved_business_path_driver_config
          from fabric_data_framework.evidence.business_path_evidence import load_approved_business_path_scenario
          from fabric_data_framework.evidence.business_path_plan import (
              load_approved_business_path_certification_plan,
              resolve_business_path_plan_file,
          )
          from fabric_data_framework.evidence.integration_evidence import (
              load_integration_evidence_manifest,
              load_integration_evidence_spec,
              validate_integration_evidence_manifest,
          )
          from fabric_data_framework.evidence.integration_runner import load_approved_integration_runner_config

          inputs = json.loads(Path("integration-inputs/INPUTS.json").read_text())
          manifest = load_release_manifest("integration-inputs/release-manifest.json")
          runner = load_approved_integration_runner_config("integration-inputs/runner-config.json")
          spec = load_integration_evidence_spec("retained/integration/integration-spec.json")
          retained = load_integration_evidence_manifest("retained/integration/integration-evidence.json")
          validate_integration_evidence_manifest(spec, retained, require_certified=True)

          input_hash = inputs["integration_inputs_hash"]
          if inputs["candidate_git_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("integration input candidate SHA mismatch")
          if inputs["candidate_wheel_sha256"] != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("integration input wheel SHA mismatch")
          if runner.framework_artifact_sha256 != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("runner framework artifact SHA mismatch")
          if runner.integration_inputs_hash != input_hash:
              raise SystemExit("runner integration input hash mismatch")
          if retained.framework_artifact_sha256 != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("integration evidence framework artifact SHA mismatch")
          if retained.integration_inputs_hash != input_hash:
              raise SystemExit("integration evidence input hash mismatch")
          if retained.environment.value != os.environ["CERTIFICATION_ENVIRONMENT"]:
              raise SystemExit("integration evidence environment mismatch")

          root = Path("integration-inputs/project")
          plan_path = resolve_business_path_plan_file(root, os.environ["BUSINESS_PATH_PLAN_PATH"])
          plan = load_approved_business_path_certification_plan(plan_path, release_manifest=manifest)
          lines = []
          for entry in plan.entries:
              scenario = load_approved_business_path_scenario(
                  resolve_business_path_plan_file(root, entry.scenario_path),
                  release_manifest=manifest,
              )
              driver = load_approved_business_path_driver_config(
                  resolve_business_path_plan_file(root, entry.driver_config_path),
                  release_manifest=manifest,
                  expected_scenario_hash=scenario.scenario_hash,
              )
              if scenario.gate_id is not entry.gate_id:
                  raise SystemExit(f"plan/scenario gate mismatch for {entry.gate_id.value}")
              if scenario.extension_artifact_name != inputs["framework_wheel_filename"]:
                  raise SystemExit("business observer is not owned by candidate framework wheel")
              if driver.extension_artifact_name != inputs["framework_wheel_filename"]:
                  raise SystemExit("business driver is not owned by candidate framework wheel")
              lines.append("\t".join((entry.gate_id.value, entry.scenario_path, entry.driver_config_path, entry.pipeline_check_id)))
          if len(lines) != 5:
              raise SystemExit("framework certification plan must contain exactly five business paths")
          Path("retained/business-path-plan.tsv").write_text("\n".join(lines) + "\n")
          Path("retained/integration-inputs-hash.txt").write_text(input_hash + "\n")
          PY

      - name: Execute five approved representative live paths
        run: |
          while IFS=$'\t' read -r gate scenario_path driver_path pipeline_check_id; do
            test -n "${gate}"
            gate_dir="retained/gates/${gate}"
            mkdir -p "${gate_dir}"
            fabric-framework candidate-business-path-run \
              --runner-config integration-inputs/runner-config.json \
              --integration-spec retained/integration/integration-spec.json \
              --certified-integration-evidence retained/integration/integration-evidence.json \
              --release-manifest integration-inputs/release-manifest.json \
              --config-dir integration-inputs/project/config/datasets \
              --scenario "integration-inputs/project/${scenario_path}" \
              --driver-config "integration-inputs/project/${driver_path}" \
              --candidate-sha "${CANDIDATE_SHA}" \
              --artifact-sha256 "${CANDIDATE_WHEEL_SHA256}" \
              --pipeline-check-id "${pipeline_check_id}" \
              --evidence-reference "github-actions://${GITHUB_REPOSITORY}/runs/${GITHUB_RUN_ID}#${gate}" \
              --report-output "${gate_dir}/report.json" \
              --proof-output "${gate_dir}/proof.json" \
              --allow-pipeline-execution \
              --allow-scenario-mutation
          done < retained/business-path-plan.tsv

      - name: Strictly merge and verify five live business-path proofs
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          mapfile -t proof_files < <(find retained/gates -name proof.json -type f | sort)
          test "${#proof_files[@]}" -eq 5
          merge_args=()
          for proof in "${proof_files[@]}"; do merge_args+=(--input "${proof}"); done
          fabric-framework release-proofs-merge \
            --spec "release/${FRAMEWORK_VERSION}/readiness-spec.json" \
            "${merge_args[@]}" \
            --output retained/final/business-path-release-proofs.json

          python - <<'PY'
          import os
          from pathlib import Path
          from fabric_data_framework.evidence.business_path_evidence import BusinessPathGate
          from fabric_data_framework.evidence.release_readiness import ReleaseReadinessStatus, load_release_readiness_proofs

          bundle = load_release_readiness_proofs("retained/final/business-path-release-proofs.json")
          expected_hash = Path("retained/integration-inputs-hash.txt").read_text().strip()
          if bundle.candidate_git_sha != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("merged business-path proof candidate SHA mismatch")
          if bundle.artifact_sha256 != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("merged business-path proof wheel SHA mismatch")
          if bundle.integration_inputs_hash != expected_hash:
              raise SystemExit("merged business-path proof integration input hash mismatch")
          expected = {gate.value for gate in BusinessPathGate}
          observed = {result.gate_id for result in bundle.results}
          if observed != expected:
              raise SystemExit(f"business-path gate coverage mismatch: {sorted(observed)}")
          if any(result.status is not ReleaseReadinessStatus.PASS for result in bundle.results):
              raise SystemExit("every business-path proof must PASS")
          PY

      - name: Assemble retained business-path artifact
        run: |
          cp retained/final/business-path-release-proofs.json retained/business-path-release-proofs.json
          cp integration-inputs/INPUTS.json retained/INPUTS.json
          cp retained/integration/integration-evidence.json retained/certified-integration-evidence.json
          rm -rf retained/integration retained/final

      - name: Upload exact-candidate business-path evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business-path-release-proofs-${{ inputs.candidate_git_sha }}-${{ inputs.environment }}
          path: retained/
          if-no-files-found: error
          retention-days: 90
