name: structure-path-migration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches:
      - refactor/final-package-structure

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'refactor/final-package-structure') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[structure-migration]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/final-package-structure
          fetch-depth: 0
      - name: Hard-cut moved paths and add package navigation
        shell: bash
        run: |
          python .github/structure_path_migration.py
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ("from ..evidence.approved_capture_runner import", "from ..evidence.integration.approved.capture import"),
              ("from ..evidence.approved_control_plane_runner import", "from ..evidence.integration.approved.control_plane import"),
              ("from ..evidence.approved_pipeline_runner import", "from ..evidence.integration.approved.pipeline import"),
              ("from ..evidence.approved_warehouse_fault_runner import", "from ..evidence.integration.approved.warehouse_fault import"),
              ("from ..evidence.approved_warehouse_runner import", "from ..evidence.integration.approved.warehouse import"),
              ("from ..evidence.integration_evidence_merge import", "from ..evidence.integration.merge import"),
              ("from ..evidence.integration_evidence_rerun import", "from ..evidence.integration.rerun import"),
              ("from ..evidence.integration_evidence import", "from ..evidence.integration.evidence import"),
              ("from ..evidence.integration_checks import", "from ..evidence.integration.checks import"),
              ("from ..evidence.integration_runner import", "from ..evidence.integration.runner import"),
              ("from fabric_data_framework.certification import fabric_job", "from fabric_data_framework.certification.fabric import fabric_job"),
              ("from fabric_data_framework.certification import pipeline_child", "from fabric_data_framework.certification.fabric import pipeline_child"),
              ("src/fabric_data_framework/evidence/approved_capture_runner.py", "src/fabric_data_framework/evidence/integration/approved/capture.py"),
              ("src/fabric_data_framework/evidence/approved_control_plane_runner.py", "src/fabric_data_framework/evidence/integration/approved/control_plane.py"),
              ("src/fabric_data_framework/evidence/approved_pipeline_runner.py", "src/fabric_data_framework/evidence/integration/approved/pipeline.py"),
              ("src/fabric_data_framework/evidence/approved_warehouse_fault_runner.py", "src/fabric_data_framework/evidence/integration/approved/warehouse_fault.py"),
              ("src/fabric_data_framework/evidence/approved_warehouse_runner.py", "src/fabric_data_framework/evidence/integration/approved/warehouse.py"),
              ("src/fabric_data_framework/evidence/approved_business_path_runner.py", "src/fabric_data_framework/evidence/business_paths/approved_runner.py"),
              ("src/fabric_data_framework/evidence/business_path_driver.py", "src/fabric_data_framework/evidence/business_paths/driver.py"),
              ("src/fabric_data_framework/evidence/business_path_evidence.py", "src/fabric_data_framework/evidence/business_paths/evidence.py"),
              ("src/fabric_data_framework/evidence/business_path_plan.py", "src/fabric_data_framework/evidence/business_paths/plan.py"),
              ("src/fabric_data_framework/evidence/business_path_release_proof.py", "src/fabric_data_framework/evidence/business_paths/release_proof.py"),
              ("src/fabric_data_framework/evidence/integration_evidence.py", "src/fabric_data_framework/evidence/integration/evidence.py"),
              ("src/fabric_data_framework/evidence/integration_checks.py", "src/fabric_data_framework/evidence/integration/checks.py"),
              ("src/fabric_data_framework/evidence/integration_runner.py", "src/fabric_data_framework/evidence/integration/runner.py"),
              ("src/fabric_data_framework/evidence/release_readiness.py", "src/fabric_data_framework/evidence/release/readiness.py"),
              ("src/fabric_data_framework/evidence/candidate_certification.py", "src/fabric_data_framework/evidence/release/candidate_certification.py"),
              ("src/fabric_data_framework/certification/fabric_assets.py", "src/fabric_data_framework/certification/fabric/assets.py"),
              ("src/fabric_data_framework/certification/fabric_job.py", "src/fabric_data_framework/certification/fabric/fabric_job.py"),
              ("src/fabric_data_framework/certification/pipeline_child.py", "src/fabric_data_framework/certification/fabric/pipeline_child.py"),
              ("src/fabric_data_framework/certification/bindings.py", "src/fabric_data_framework/certification/fabric/bindings.py"),
              ("src/fabric_data_framework/quality/reconciliation_engine.py", "src/fabric_data_framework/quality/reconciliation/engine.py"),
              ("src/fabric_data_framework/quality/full_refresh.py", "src/fabric_data_framework/quality/reconciliation/full_replace.py"),
              ("src/fabric_data_framework/quality/append.py", "src/fabric_data_framework/quality/reconciliation/append.py"),
              ("src/fabric_data_framework/quality/snapshot_diff.py", "src/fabric_data_framework/quality/reconciliation/snapshot_diff.py"),
              ("src/fabric_data_framework/execution/dataset_runner.py", "src/fabric_data_framework/execution/watermark_scd2.py"),
          ]
          roots = [Path("src"), Path("tests"), Path("docs"), Path("certification_harness"), Path("examples"), Path("release")]
          files = [Path("README.md"), Path("CONTRIBUTING.md"), Path("pyproject.toml")]
          extensions = {".py", ".md", ".yml", ".yaml", ".json", ".toml", ".txt"}
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix in extensions)
          for path in sorted(set(files)):
              if not path.exists():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply hard-cut package path migration [structure-migration]"
          git push origin HEAD:refactor/final-package-structure
