name: temporary-refactor-warehouse-fault

on:
  push:
    branches: [refactor/architecture-readability-boundaries]

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[warehouse-fault-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/architecture-readability-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Replace public runner with typed-stage facade
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/fabric_data_framework/evidence/integration/approved/warehouse_fault.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('\ndef _require_prerequisites(')
          end = source.index('\n\n__all__ = [', start)
          wrapper = r'''
          def execute_approved_warehouse_fault_drill(  # noqa: PLR0913
              *,
              config: ApprovedIntegrationRunnerConfig,
              spec: IntegrationEvidenceSpec,
              prerequisite_manifest: IntegrationEvidenceManifest,
              release_manifest: ReleaseManifest,
              configs: Iterable[DatasetConfig],
              run_config: ApprovedWarehouseFaultDrillConfig,
              environ: Mapping[str, str],
              evidence_references: Iterable[str],
              allow_warehouse_fault_injection: bool,
              allow_warehouse_session_termination: bool = False,
              extension_registry: ExtensionRegistry | None = None,
              control_engine_factory: EngineFactory = create_engine,
              warehouse_engine_factory: EngineFactory = create_engine,
              warehouse_admin_engine_factory: EngineFactory = create_engine,
              marker_store_factory: MarkerStoreFactory = _default_marker_store_factory,
              session_binding_capture: SessionBindingCapture = capture_fabric_warehouse_session_binding,
              session_authority_factory: SessionAuthorityFactory = _default_session_authority_factory,
          ) -> ApprovedWarehouseFaultDrillExecution:
              """Execute one approved real-fault drill through fail-closed typed stages."""

              from .warehouse_fault_stages import (
                  WarehouseFaultDrillRequest,
                  WarehouseFaultDrillServices,
                  execute_approved_warehouse_fault_drill_staged,
              )

              request = WarehouseFaultDrillRequest(
                  config=config,
                  spec=spec,
                  prerequisite_manifest=prerequisite_manifest,
                  release_manifest=release_manifest,
                  configs=tuple(configs),
                  run_config=run_config,
                  environ=environ,
                  evidence_references=tuple(evidence_references),
                  allow_warehouse_fault_injection=allow_warehouse_fault_injection,
                  allow_warehouse_session_termination=allow_warehouse_session_termination,
              )
              services = WarehouseFaultDrillServices(
                  extension_registry=extension_registry,
                  control_engine_factory=control_engine_factory,
                  warehouse_engine_factory=warehouse_engine_factory,
                  warehouse_admin_engine_factory=warehouse_admin_engine_factory,
                  marker_store_factory=marker_store_factory,
                  session_binding_capture=session_binding_capture,
                  session_authority_factory=session_authority_factory,
              )
              return execute_approved_warehouse_fault_drill_staged(request, services)
          '''
          wrapper = '\n' + textwrap.dedent(wrapper).strip() + '\n'
          path.write_text(source[:start] + wrapper + source[end:], encoding='utf-8')
          PY
      - name: Refine typed stage contexts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fabric_data_framework/evidence/integration/approved/warehouse_fault_stages.py')
          source = path.read_text(encoding='utf-8')

          def replace_func(text: str, name: str, replacement: str) -> str:
              start = text.index(f'def {name}(')
              candidates = []
              for marker in ('\ndef ', '\n@dataclass', '\n__all__'):
                  pos = text.find(marker, start + 1)
                  if pos != -1:
                      candidates.append(pos + 1)
              end = min(candidates)
              return text[:start] + replacement.rstrip() + '\n\n' + text[end:]

          trace = '''@dataclass(frozen=True)
          class WarehouseFaultDrillTrace:
              mutation: FaultMutationOutcome
              probe: FaultProbeOutcome | None
              verification: FaultVerificationOutcome | None
              recovery: SessionRecoveryOutcome | None
              assessment: WarehouseFaultAssessment
          '''
          trace = '\n'.join(line[10:] if line.startswith('          ') else line for line in trace.splitlines())
          contexts = trace + '''


@dataclass(frozen=True)
class WarehouseFaultRuntime:
    request: WarehouseFaultDrillRequest
    services: WarehouseFaultDrillServices
    preflight: WarehouseFaultPreflight
    control_engine: Engine
    warehouse_engine: Engine
    marker_store: FabricWarehouseMarkerStore
    plain_probe: FabricWarehouseTargetCommitProbe


@dataclass(frozen=True)
class FaultArmContext:
    dataset_run_id: UUID
    claim: TargetOperationClaim
    fault_request: FabricWarehouseCommitFaultRequest
    arm: FabricWarehouseCommitFaultArmEvidence


@dataclass(frozen=True)
class FaultResultContext:
    check_id: str
    intent: TargetOperationIntent
    dataset_run_id: UUID
    evidence_references: tuple[str, ...]


@dataclass(frozen=True)
class FaultEvaluation:
    reentry_action: str | None
    retry_eligible: bool
'''
          if 'class WarehouseFaultRuntime:' not in source:
              source = source.replace(trace, contexts, 1)

          source = replace_func(source, '_build_result', '''def _build_result(
    context: FaultResultContext,
    *,
    status: IntegrationEvidenceStatus,
    native_operation_id: str | None,
    detail_code: str,
) -> IntegrationEvidenceCheckResult:
    assert_safe_retained_text(detail_code, "Warehouse fault drill detail code")
    return IntegrationEvidenceCheckResult(
        check_id=context.check_id,
        kind=IntegrationEvidenceCheckKind.FABRIC_WAREHOUSE_AMBIGUOUS_COMMIT_DRILL,
        status=status,
        dataset_run_id=context.dataset_run_id,
        operation_key=context.intent.operation_key,
        native_operation_id=native_operation_id,
        evidence_references=context.evidence_references,
        detail=(
            "approved Warehouse ambiguous-COMMIT fault drill "
            f"{status.value}; reason={detail_code}"
        ),
    )''')

          source = replace_func(source, '_execute_faulted_mutation', '''def _execute_faulted_mutation(
    runtime: WarehouseFaultRuntime,
    injector: FabricWarehouseCommitFaultInjector,
    arm_context: FaultArmContext,
) -> FaultMutationOutcome:
    session_binding: FabricWarehouseSessionBinding | None = None
    session_binding_capture_exception_type: str | None = None

    def mutation(connection, observed_intent):
        nonlocal session_binding, session_binding_capture_exception_type
        if (
            runtime.request.run_config.enable_session_termination_recovery
            and session_binding is None
        ):
            try:
                session_binding = runtime.services.session_binding_capture(connection)
            except Exception as exc:
                session_binding_capture_exception_type = type(exc).__name__
                raise
        return runtime.preflight.mutation_extension(
            connection,
            observed_intent,
            runtime.request.run_config.mutation_payload,
        )

    atomic_result: FabricWarehouseAtomicMutationResult | None = None
    execution_exception_type: str | None = None
    disarm_exception_type: str | None = None
    try:
        atomic_result = runtime.marker_store.execute_atomic(
            intent=runtime.preflight.intent,
            dataset_run_id=arm_context.dataset_run_id,
            attempt=1,
            mutation=mutation,
        )
    except Exception as exc:
        execution_exception_type = type(exc).__name__
    finally:
        try:
            injector.disarm(arm_context.fault_request)
        except Exception as exc:
            disarm_exception_type = type(exc).__name__

    return FaultMutationOutcome(
        dataset_run_id=arm_context.dataset_run_id,
        claim=arm_context.claim,
        fault_request=arm_context.fault_request,
        arm=arm_context.arm,
        atomic_result=atomic_result,
        session_binding=session_binding,
        session_binding_capture_exception_type=session_binding_capture_exception_type,
        execution_exception_type=execution_exception_type,
        disarm_exception_type=disarm_exception_type,
    )''')

          source = replace_func(source, '_recover_session', '''def _recover_session(
    runtime: WarehouseFaultRuntime,
    mutation: FaultMutationOutcome,
    probe: FaultProbeOutcome,
    verification: FaultVerificationOutcome,
) -> SessionRecoveryOutcome:
    if not _session_recovery_eligible(
        runtime.request,
        mutation,
        probe,
        verification,
    ):
        return SessionRecoveryOutcome(
            probe_evidence=probe.probe_evidence,
            record=probe.record,
            atomic_result=probe.atomic_result,
            attempted=False,
            exception_type=None,
            absence_safe_to_retry=None,
        )

    admin_engine: Engine | None = None
    try:
        admin_env_var = runtime.request.config.warehouse_admin_database_url_env_var
        assert admin_env_var is not None
        admin_database_url = runtime.request.environ[admin_env_var]
        admin_engine = runtime.services.warehouse_admin_engine_factory(admin_database_url)
        authority = runtime.services.session_authority_factory(admin_engine)
        if not isinstance(authority, FabricWarehouseSessionAuthority):
            raise TypeError("Warehouse session authority factory returned an invalid controller")
        assert mutation.session_binding is not None
        absence_certifier = FabricWarehouseSessionTerminationAbsenceCertifier(
            binding=mutation.session_binding,
            authority=authority,
            marker_store=runtime.marker_store,
        )
        recovery_probe = FabricWarehouseTargetCommitProbe(
            marker_store=runtime.marker_store,
            absence_certifier=absence_certifier,
        )
        recovered = probe_and_reconcile_target_operation(
            runtime.control_engine,
            operation_key=runtime.preflight.intent.operation_key,
            dataset_run_id=uuid4(),
            attempt=max(2, probe.record.attempt + 1),
            probe=recovery_probe,
        )
        probe_evidence = recovered.evidence
        record = recovered.record
        atomic_result = probe.atomic_result
        absence_safe_to_retry = (
            probe_evidence.resolution is UnknownOutcomeResolution.NOT_COMMITTED
            and record.status is TargetOperationStatus.NOT_COMMITTED
        )
        if (
            probe_evidence.resolution is UnknownOutcomeResolution.UNRESOLVED
            and record.status is TargetOperationStatus.UNKNOWN
        ):
            final_probe = probe_and_reconcile_target_operation(
                runtime.control_engine,
                operation_key=runtime.preflight.intent.operation_key,
                dataset_run_id=uuid4(),
                attempt=max(2, record.attempt + 1),
                probe=runtime.plain_probe,
            )
            probe_evidence = final_probe.evidence
            record = final_probe.record
            if (
                atomic_result is None
                and probe_evidence.resolution is UnknownOutcomeResolution.COMMITTED
            ):
                atomic_result = _atomic_from_committed_marker(
                    runtime.marker_store,
                    runtime.preflight.intent,
                )
        return SessionRecoveryOutcome(
            probe_evidence=probe_evidence,
            record=record,
            atomic_result=atomic_result,
            attempted=True,
            exception_type=None,
            absence_safe_to_retry=absence_safe_to_retry,
        )
    except Exception as exc:
        return SessionRecoveryOutcome(
            probe_evidence=probe.probe_evidence,
            record=probe.record,
            atomic_result=probe.atomic_result,
            attempted=True,
            exception_type=type(exc).__name__,
            absence_safe_to_retry=None,
        )
    finally:
        if admin_engine is not None:
            admin_engine.dispose()''')

          source = replace_func(source, '_failure_reason', '''def _execution_failure_reason(
    mutation: FaultMutationOutcome,
    verification: FaultVerificationOutcome,
) -> str | None:
    if mutation.session_binding_capture_exception_type is not None:
        return "SESSION_BINDING_CAPTURE_FAILED"
    if mutation.execution_exception_type is None:
        return "NO_PROVIDER_OR_DRIVER_EXCEPTION"
    if mutation.disarm_exception_type is not None:
        return "FAULT_DISARM_FAILED"
    if verification.verification_exception_type is not None:
        return "FAULT_VERIFICATION_FAILED"
    if not verification.fault_verified:
        return "FAULT_NOT_VERIFIED"
    if not verification.identity_matches:
        return "FAULT_IDENTITY_MISMATCH"
    return None


def _recovery_failure_reason(
    runtime: WarehouseFaultRuntime,
    mutation: FaultMutationOutcome,
    recovery: SessionRecoveryOutcome,
    evaluation: FaultEvaluation,
) -> str | None:
    if recovery.exception_type is not None:
        return "SESSION_TERMINATION_RECOVERY_FAILED"
    if evaluation.retry_eligible and recovery.absence_safe_to_retry:
        return "SAFE_NOT_COMMITTED_AFTER_SESSION_TERMINATION"
    if (
        runtime.request.run_config.enable_session_termination_recovery
        and recovery.probe_evidence.resolution is UnknownOutcomeResolution.UNRESOLVED
        and mutation.session_binding is None
    ):
        return "SESSION_BINDING_NOT_CAPTURED"
    if recovery.probe_evidence.resolution is not UnknownOutcomeResolution.COMMITTED:
        return f"MARKER_{recovery.probe_evidence.resolution.value}"
    if recovery.record.status is not TargetOperationStatus.SUCCEEDED:
        return f"FINAL_{recovery.record.status.value}"
    if evaluation.reentry_action != TargetOperationAction.SKIP_SUCCEEDED.value:
        return "REENTRY_NOT_SKIP_SUCCEEDED"
    return None


def _failure_reason(
    runtime: WarehouseFaultRuntime,
    mutation: FaultMutationOutcome,
    verification: FaultVerificationOutcome,
    recovery: SessionRecoveryOutcome,
    evaluation: FaultEvaluation,
) -> str | None:
    execution_failure = _execution_failure_reason(mutation, verification)
    if execution_failure is not None:
        return execution_failure
    return _recovery_failure_reason(runtime, mutation, recovery, evaluation)''')

          source = replace_func(source, '_assess', '''def _assess(
    runtime: WarehouseFaultRuntime,
    mutation: FaultMutationOutcome,
    verification: FaultVerificationOutcome,
    recovery: SessionRecoveryOutcome,
) -> WarehouseFaultAssessment:
    reentry_action = _claim_reentry(
        runtime.control_engine,
        preflight=runtime.preflight,
        record=recovery.record,
    )
    evaluation = FaultEvaluation(
        reentry_action=reentry_action,
        retry_eligible=recovery.record.status is TargetOperationStatus.NOT_COMMITTED,
    )
    passed = (
        mutation.execution_exception_type is not None
        and mutation.session_binding_capture_exception_type is None
        and mutation.disarm_exception_type is None
        and verification.verification_exception_type is None
        and verification.fault_verified
        and verification.identity_matches
        and recovery.probe_evidence.resolution is UnknownOutcomeResolution.COMMITTED
        and recovery.record.status is TargetOperationStatus.SUCCEEDED
        and evaluation.reentry_action == TargetOperationAction.SKIP_SUCCEEDED.value
        and recovery.atomic_result is not None
    )
    failure_reason = _failure_reason(runtime, mutation, verification, recovery, evaluation)
    references = _dedupe_references(
        runtime.preflight.references,
        (mutation.arm.evidence_reference,),
        (
            verification.verification.evidence_reference
            if verification.verification is not None
            else None,
        ),
        (
            recovery.atomic_result.marker_reference
            if recovery.atomic_result is not None
            else recovery.probe_evidence.evidence_reference,
        ),
        (
            mutation.session_binding.evidence_reference
            if mutation.session_binding is not None and recovery.attempted
            else None,
        ),
    )
    native_operation_id = (
        recovery.atomic_result.marker.native_operation_id
        if recovery.atomic_result is not None
        else recovery.probe_evidence.native_operation_id
    )
    return WarehouseFaultAssessment(
        status=IntegrationEvidenceStatus.PASS if passed else IntegrationEvidenceStatus.FAIL,
        failure_reason=failure_reason,
        reentry_action=evaluation.reentry_action,
        retry_eligible=evaluation.retry_eligible,
        references=references,
        native_operation_id=native_operation_id,
    )''')

          source = replace_func(source, '_fault_not_armed', '''def _fault_not_armed(
    runtime: WarehouseFaultRuntime,
    arm_context: FaultArmContext,
) -> tuple[IntegrationEvidenceCheckResult, ApprovedWarehouseFaultDrillReport]:
    current = mark_target_operation_not_committed(
        runtime.control_engine,
        operation_key=runtime.preflight.intent.operation_key,
        expected_version=arm_context.claim.record.version,
        dataset_run_id=arm_context.dataset_run_id,
        attempt=1,
        outcome_reference=arm_context.arm.evidence_reference,
    )
    retained = _dedupe_references(runtime.preflight.references, (arm_context.arm.evidence_reference,))
    mutation = FaultMutationOutcome(
        dataset_run_id=arm_context.dataset_run_id,
        claim=arm_context.claim,
        fault_request=arm_context.fault_request,
        arm=arm_context.arm,
        atomic_result=None,
        session_binding=None,
        session_binding_capture_exception_type=None,
        execution_exception_type=None,
        disarm_exception_type=None,
    )
    assessment = WarehouseFaultAssessment(
        status=IntegrationEvidenceStatus.FAIL,
        failure_reason="FAULT_NOT_ARMED",
        reentry_action=None,
        retry_eligible=True,
        references=retained,
        native_operation_id=None,
    )
    trace = WarehouseFaultDrillTrace(
        mutation=mutation,
        probe=None,
        verification=None,
        recovery=None,
        assessment=assessment,
    )
    report = _report_from_trace(runtime.request, runtime.preflight, trace).model_copy(
        update={"final_status": current.status}
    )
    result = _build_result(
        FaultResultContext(
            check_id=runtime.request.run_config.check_id,
            intent=runtime.preflight.intent,
            dataset_run_id=arm_context.dataset_run_id,
            evidence_references=retained,
        ),
        status=IntegrationEvidenceStatus.FAIL,
        native_operation_id=None,
        detail_code="FAULT_NOT_ARMED",
    )
    return result, report''')

          source = replace_func(source, '_run_one', '''def _run_one(
    request: WarehouseFaultDrillRequest,
    services: WarehouseFaultDrillServices,
    preflight: WarehouseFaultPreflight,
) -> tuple[IntegrationEvidenceCheckResult, ApprovedWarehouseFaultDrillReport | None]:
    control_engine = services.control_engine_factory(preflight.control_database_url)
    warehouse_engine = services.warehouse_engine_factory(preflight.warehouse_database_url)
    dataset_run_id = uuid4()
    try:
        _validate_deployed_identity(control_engine, request=request, preflight=preflight)
        marker_store = services.marker_store_factory(warehouse_engine, request.run_config)
        plain_probe = FabricWarehouseTargetCommitProbe(marker_store=marker_store)
        runtime = WarehouseFaultRuntime(
            request=request,
            services=services,
            preflight=preflight,
            control_engine=control_engine,
            warehouse_engine=warehouse_engine,
            marker_store=marker_store,
            plain_probe=plain_probe,
        )
        claim = _claim_fresh_operation(control_engine, preflight, dataset_run_id)
        if claim.action is not TargetOperationAction.EXECUTE:
            return (
                _build_result(
                    FaultResultContext(
                        check_id=request.run_config.check_id,
                        intent=preflight.intent,
                        dataset_run_id=dataset_run_id,
                        evidence_references=preflight.references,
                    ),
                    status=IntegrationEvidenceStatus.FAIL,
                    native_operation_id=None,
                    detail_code=f"FRESH_EXECUTE_REQUIRED_{claim.action.value}",
                ),
                None,
            )
        fault_request = _build_fault_request(preflight.intent, dataset_run_id)
        injector, arm = _arm_fault(
            warehouse_engine,
            request=request,
            preflight=preflight,
            fault_request=fault_request,
        )
        arm_context = FaultArmContext(
            dataset_run_id=dataset_run_id,
            claim=claim,
            fault_request=fault_request,
            arm=arm,
        )
        if not arm.armed:
            return _fault_not_armed(runtime, arm_context)
        mutation = _execute_faulted_mutation(runtime, injector, arm_context)
        probe = _mark_unknown_and_probe(
            control_engine,
            marker_store,
            plain_probe,
            preflight=preflight,
            mutation=mutation,
        )
        verification = _verify_fault(injector, mutation=mutation, probe=probe)
        recovery = _recover_session(runtime, mutation, probe, verification)
        assessment = _assess(runtime, mutation, verification, recovery)
        trace = WarehouseFaultDrillTrace(
            mutation=mutation,
            probe=probe,
            verification=verification,
            recovery=recovery,
            assessment=assessment,
        )
        report = _report_from_trace(request, preflight, trace)
        result = _build_result(
            FaultResultContext(
                check_id=request.run_config.check_id,
                intent=preflight.intent,
                dataset_run_id=dataset_run_id,
                evidence_references=assessment.references,
            ),
            status=assessment.status,
            native_operation_id=assessment.native_operation_id,
            detail_code=assessment.failure_reason or "REAL_FAULT_COMMITTED_RECOVERED",
        )
        return result, report
    finally:
        warehouse_engine.dispose()
        control_engine.dispose()''')

