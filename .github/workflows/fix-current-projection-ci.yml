name: fix-current-projection-ci

on:
  push:
    branches:
      - feat/current-history-projections
    paths:
      - .github/scripts/fix_current_projection_ci.py
      - .github/workflows/fix-current-projection-ci.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/current-history-projections
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python .github/scripts/fix_current_projection_ci.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No fixes to commit"
          else
            git commit -m "fix: address current projection CI findings"
            git push origin HEAD:feat/current-history-projections
          fi
