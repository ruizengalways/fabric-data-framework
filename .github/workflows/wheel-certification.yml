name: installed-wheel-acceptance

on:
  pull_request:
  push:
    branches: [main, "refactor/**"]

permissions:
  contents: read

jobs:
  installed-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Build candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name 'fabric_data_framework-*.whl' | wc -l)" -eq 1
      - name: Install exact wheel in clean interpreter
        run: |
          python -m venv .cert-venv
          .cert-venv/bin/python -m pip install dist/fabric_data_framework-*.whl
          .cert-venv/bin/python -m pip check
      - name: Attest active installed package bytes
        run: .cert-venv/bin/python certification_harness/smoke_installed_wheel.py --wheel dist/fabric_data_framework-*.whl
      - name: Prove source tree is not import path
        run: |
          .cert-venv/bin/python - <<'PY'
          import pathlib
          import fabric_data_framework
          module = pathlib.Path(fabric_data_framework.__file__).resolve()
          repo_src = (pathlib.Path.cwd() / "src").resolve()
          assert repo_src not in module.parents, (module, repo_src)
          print(module)
          PY
