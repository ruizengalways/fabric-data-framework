name: tmp-update-projection-docs

on:
  push:
    branches:
      - fix/finish-current-projection-production
    paths:
      - .github/workflows/tmp-update-projection-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/finish-current-projection-production
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python tmp_update_projection_docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PROJECTIONS.md docs/OPERATIONS.md docs/internal/CAPABILITIES.md docs/internal/IMPLEMENTATION_MAP.md docs/internal/STATE.md tests/test_current_docs_consistency.py
          git commit -m "Document projection production runtime and invalidate candidate"
          git push origin HEAD:fix/finish-current-projection-production
