name: temporary-append-scalability-refactor

on:
  push:
    branches: [refactor/append-scalability-foundations]

permissions:
  contents: read

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/append-scalability-foundations
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply hard cut and documentation updates
        run: |
          python scripts/_temporary_append_scalability_refactor.py
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()
          SRC = ROOT / "src/fabric_data_framework"
          TESTS = ROOT / "tests"

          def ensure_import(text: str, import_line: str) -> str:
              if import_line in text:
                  return text
              future = "from __future__ import annotations\n"
              if future in text:
                  return text.replace(future, future + "\n" + import_line + "\n", 1)
              match = re.match(r'(?s)(""".*?"""\n)', text)
              if match:
                  return text[: match.end()] + "\n" + import_line + "\n" + text[match.end() :]
              return import_line + "\n" + text

          for base in (SRC, TESTS):
              for path in base.rglob("*.py"):
                  if path == SRC / "contracts/temporal.py":
                      continue
                  text = path.read_text(encoding="utf-8")
                  original = text
                  text = re.sub(r"\b_utcnow\b", "utc_now", text)
                  text = re.sub(r"\b_require_aware\b", "require_aware_datetime", text)
                  needs_now = re.search(r"\butc_now\b", text) is not None
                  needs_aware = re.search(r"\brequire_aware_datetime\b", text) is not None
                  if needs_now or needs_aware:
                      names = []
                      if needs_aware:
                          names.append("require_aware_datetime")
                      if needs_now:
                          names.append("utc_now")
                      text = ensure_import(
                          text,
                          "from fabric_data_framework.contracts.temporal import " + ", ".join(names),
                      )
                  if (
                      path == SRC / "apply/append.py"
                      and "canonical_hash(" in text
                      and "from fabric_data_framework.contracts.hashing import canonical_hash" not in text
                  ):
                      text = ensure_import(
                          text,
                          "from fabric_data_framework.contracts.hashing import canonical_hash",
                      )
                  if text != original:
                      path.write_text(text, encoding="utf-8")

          config_path = SRC / "metadata/config.py"
          config = config_path.read_text(encoding="utf-8")
          config = config.replace(
              "from fabric_data_framework.contracts.hashing import canonical_hash\n",
              "from fabric_data_framework.contracts.hashing import canonical_hash as _canonical_hash\n",
              1,
          )
          config = re.sub(r"\bcanonical_hash\(", "_canonical_hash(", config)
          config_path.write_text(config, encoding="utf-8")

          foundation_path = TESTS / "test_foundation_primitives.py"
          foundation = foundation_path.read_text(encoding="utf-8")
          foundation = foundation.replace(
              'if "def utc_now(" in text or "utc_now()" in text:',
              'if "def _utcnow(" in text or "datetime.now(timezone.utc)" in text:',
              1,
          )
          foundation_path.write_text(foundation, encoding="utf-8")

          append_test_path = TESTS / "test_append_spark_runtime.py"
          append_test = append_test_path.read_text(encoding="utf-8")
          append_test = append_test.replace(
              "capture_strategy=CaptureStrategy.WATERMARK,",
              "capture_strategy=CaptureStrategy.FULL,",
              1,
          )
          append_test_path.write_text(append_test, encoding="utf-8")

          leftovers = []
          for path in SRC.rglob("*.py"):
              if path.name == "temporal.py":
                  continue
              text = path.read_text(encoding="utf-8")
              if re.search(r"\b_utcnow\b|\b_require_aware\b", text):
                  leftovers.append(path.relative_to(ROOT).as_posix())
          if leftovers:
              raise SystemExit("legacy temporal references remain: " + ", ".join(leftovers))
          PY
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Remove only mechanically stale or duplicate imports
        run: ruff check --fix --select F401,F811 src tests
      - name: Verify static, types, focused behavior and complexity
        run: |
          ruff check src tests
          python -m compileall -q src tests
          python -m pip check
          mypy \
            src/fabric_data_framework/contracts/runtime.py \
            src/fabric_data_framework/contracts/typed_values.py \
            src/fabric_data_framework/control_plane/repository.py \
            src/fabric_data_framework/recovery/runtime.py
          pytest -q \
            tests/test_foundation_primitives.py \
            tests/test_append.py \
            tests/test_append_execution.py \
            tests/test_append_metadata.py \
            tests/test_append_spark_runtime.py \
            tests/test_current_projection_production_runtime.py \
            tests/test_current_docs_consistency.py
          ruff check --isolated --select C901,PLR0913,PLR0915 \
            src/fabric_data_framework/adapters/fabric/append.py \
            src/fabric_data_framework/execution/backends/fabric_spark_append.py \
            src/fabric_data_framework/execution/backends/fabric_spark_dataset.py \
            src/fabric_data_framework/adapters/fabric/current_projection.py
      - name: Prepare validated working tree
        run: |
          rm -f scripts/_temporary_append_scalability_refactor.py
          rm -f scripts/_temporary_append_scalability_fix.py
          rm -f .github/workflows/append-scalability-refactor.yml
          rm -rf src/fabric_data_framework.egg-info .pytest_cache
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -name '*.pyc' -delete
          git diff --binary HEAD > /tmp/append-scalability.patch
          git diff --name-status HEAD > /tmp/append-scalability-files.txt
          test -s /tmp/append-scalability.patch
          tar --exclude=.git --exclude=.pytest_cache --exclude=src/fabric_data_framework.egg-info -czf /tmp/append-scalability-tree.tar.gz .
      - name: Upload validated working tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: append-scalability-validated-tree
          path: |
            /tmp/append-scalability.patch
            /tmp/append-scalability-files.txt
            /tmp/append-scalability-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
