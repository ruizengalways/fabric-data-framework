name: runtime-safety-docs

on:
  push:
    branches:
      - fix/runtime-safety-hardening
    paths:
      - .github/scripts/runtime_safety_docs.py
      - .github/workflows/runtime-safety-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-safety-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply docs/state updates
        run: python .github/scripts/runtime_safety_docs.py
      - name: Commit generated edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tests/test_current_docs_consistency.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: record runtime safety invariants and candidate invalidation"
            git push origin HEAD:fix/runtime-safety-hardening
          fi
