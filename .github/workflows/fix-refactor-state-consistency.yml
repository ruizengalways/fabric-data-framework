name: temporary-fix-refactor-state-consistency

on:
  push:
    branches: [refactor/architecture-readability-boundaries]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[state-consistency-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/architecture-readability-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Align current-state checkpoint and lock test
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path("docs/internal/STATE.md")
          state = state_path.read_text(encoding="utf-8")
          replacements = [
              ("  - keep the exact selected candidate wheel bytes immutable while Fabric certification is pending", "  - merge the architecture/readability refactor only after exact PR-head CI and installed-wheel acceptance pass\n  - keep release blocked and leave current_source_candidate_git_sha unselected during this refactor task\n  - select exact post-merge main source + wheel bytes only in a separate explicit candidate-selection task"),
              ("  - bootstrap/read back framework-owned certification assets using the exact selected wheel", "  - bootstrap/read back framework-owned certification assets using that newly selected exact wheel"),
              ("  - install/attest the exact selected wheel in isolated DEV Fabric", "  - install/attest that newly selected exact wheel in isolated DEV Fabric"),
              ("## Selected projection-production candidate", "## Superseded projection-production candidate"),
          ]
          for old, new in replacements:
              if old not in state:
                  raise SystemExit(f"missing STATE anchor: {old}")
              state = state.replace(old, new, 1)
          old_paragraph = "This exact executable candidate is **selected but not frozen**. It has not constructed\n`integration_inputs_hash`, executed Microsoft Fabric, authorized release, or claimed\nFabric PASS. Candidate/evidence identity remains\n`framework_artifact_sha256 + integration_inputs_hash`; these selected wheel bytes must\nnot change before identity-bound Fabric certification."
          new_paragraph = "This historical executable candidate is **superseded by the architecture/readability\nrefactor** and is retained only as provenance. It must not be used as the current source\ncandidate. This refactor intentionally selects no replacement candidate and performs no\ncandidate hash/release bookkeeping. The historical candidate never constructed\n`integration_inputs_hash`, executed Microsoft Fabric, authorized release, or claimed\nFabric PASS."
          if old_paragraph not in state:
              raise SystemExit("missing stale selected-candidate paragraph")
          state = state.replace(old_paragraph, new_paragraph, 1)
          state_path.write_text(state, encoding="utf-8")

          test_path = Path("tests/test_current_docs_consistency.py")
          test = test_path.read_text(encoding="utf-8")
          test_replacements = [
              ('"exact_candidate_source_selected: true",', '"exact_candidate_source_selected: false",'),
              ('"current_source_candidate_git_sha: 5d4b69702acc3e362a52a3b890cc7096f2acc02a",', '"current_source_candidate_git_sha: not_selected_after_architecture_readability_refactor",'),
              ('"current_source_framework_artifact_sha256: 5e19368c5c63e48e78abb47aa095638d4f0b39c831fc909c37df6817ed7e21a8",', '"current_source_framework_artifact_sha256: not_selected_after_architecture_readability_refactor",'),
              ('"current_source_requires_new_exact_artifact_before_release_claim: false",', '"current_source_requires_new_exact_artifact_before_release_claim: true",\n        "candidate_bytes_must_not_change: false",'),
              ('"status: selected_not_frozen",', '"status: superseded_by_architecture_readability_refactor",'),
              ('"exact_current_candidate_selected: true",', '"exact_current_candidate_selected: false",'),
              ('"current_source_installed_wheel_acceptance: passed_main_run_34689765815",', '"current_source_installed_wheel_acceptance: not_run_for_new_current_source",'),
          ]
          for old, new in test_replacements:
              if old not in test:
                  raise SystemExit(f"missing test anchor: {old}")
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding="utf-8")
          PY
          rm -f .github/workflows/fix-refactor-state-consistency.yml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify state consistency and architecture gates
        run: |
          pytest -q tests/test_current_docs_consistency.py
          ruff check src tests
          ruff check --isolated --select C901,PLR0913,PLR0915 \
            src/fabric_data_framework/certification/unified.py \
            src/fabric_data_framework/certification/unified_stages.py \
            src/fabric_data_framework/evidence/integration/approved/warehouse_fault.py \
            src/fabric_data_framework/evidence/integration/approved/warehouse_fault_stages.py \
            src/fabric_data_framework/adapters/fabric/current_projection.py
      - name: Commit fixed state checkpoint
        run: |
          rm -rf src/fabric_data_framework.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align refactor state checkpoint and consistency test [state-consistency-fixed]'
          git push origin HEAD:refactor/architecture-readability-boundaries
