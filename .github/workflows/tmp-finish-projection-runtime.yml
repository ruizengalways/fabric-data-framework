name: tmp-finish-projection-runtime

on:
  push:
    branches:
      - fix/finish-current-projection-production
    paths:
      - .github/workflows/tmp-finish-projection-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/finish-current-projection-production
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python tmp_finish_projection_runtime.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework/control_plane/schema.py src/fabric_data_framework/deployment/current_projection.py
          git commit -m "Harden projection runtime schema and key contract"
          git push origin HEAD:fix/finish-current-projection-production
