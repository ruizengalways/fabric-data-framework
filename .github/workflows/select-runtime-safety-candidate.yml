name: select-runtime-safety-candidate

on:
  push:
    branches:
      - docs/select-runtime-safety-candidate
    paths:
      - .github/scripts/select_runtime_safety_candidate_v2.py
      - .github/workflows/select-runtime-safety-candidate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/select-runtime-safety-candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply candidate selection
        run: python .github/scripts/select_runtime_safety_candidate_v2.py
      - name: Commit selected candidate state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/internal/STATE.md tests/test_current_docs_consistency.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: select exact runtime safety candidate"
            git push origin HEAD:docs/select-runtime-safety-candidate
          fi
