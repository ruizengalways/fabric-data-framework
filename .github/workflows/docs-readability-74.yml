name: docs-readability-74

on:
  push:
    branches:
      - codex/docs-readability-baseline-74

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/docs-readability-baseline-74
          fetch-depth: 0
      - name: Record canonical readability baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          state = root / 'docs/machine/STATE.md'
          text = state.read_text(encoding='utf-8')
          old = '''code_baseline:
  pull_request: 68
  merge_sha: a117c27a32b4e4f9c4bf1a7dcf6a35e9d3f6d16b
  exact_candidate_head: 930c1b22f9901d447250db0799b3f7e855d38303
  milestone: canonical-only explicit package ownership; root package is namespace-only
  ci_actions: 33291942505
  tests: 592
'''
          new = '''code_baseline:
  pull_request: 74
  merge_sha: 0b82a55981700484e68c5fb9f68de7c94a68b75b
  exact_candidate_head: 69077c16064591447a08c5924892054e755c7008
  milestone: canonical-only explicit module ownership; source root and major domain package roots are namespace-only
  ci_actions: 33302223695
  tests: 615
'''
          if old not in text:
              raise RuntimeError('STATE baseline block mismatch')
          text = text.replace(old, new)
          text = text.replace(
              'from fabric_data_framework.config import DatasetConfig',
              'from fabric_data_framework.metadata.config import DatasetConfig',
          )
          text = text.replace(
              'root schema_contract.py, operations.py and target_operations.py stay absent',
              'root schema_contract.py, operations.py and target_operations.py stay absent\nroot config.py, runtime.py, infrastructure.py, dispatcher.py, watermark.py, scd2.py, bronze.py, reconciliation.py and fabric_auth.py stay absent',
          )
          text = text.replace(
              'contracts/__init__.py does not recreate an eager re-export facade\ncontrol_plane/__init__.py does not recreate the old control-plane API',
              'contracts/__init__.py does not recreate an eager re-export facade\ncontrol_plane/__init__.py does not recreate the old control-plane API\nrecovery, capture, apply, quality and orchestration package roots are namespace-only',
          )
          start = text.index('## Next reusable readability work')
          end = text.index('## Repository ownership')
          replacement = '''## Next reusable readability work

The source root is now namespace-only and the major semantic package facades have been removed. Do not continue moving files merely to maximize folder count.

Inspect remaining package roots independently before any further change:

```text
execution/
adapters/
extensions/
metadata/
data_plane/
```

Only remove another facade when symbol ownership is unambiguous, all callers can use explicit submodules, and the full contract suite remains green. Prefer stopping the structural cleanup and returning to exact-candidate/live-evidence work once no material readability problem remains.

'''
          text = text[:start] + replacement + text[end:]
          state.write_text(text, encoding='utf-8')

          history = root / 'docs/machine/HISTORY.md'
          text = history.read_text(encoding='utf-8')
          marker = '| #68 | `a117c27a32b4e4f9c4bf1a7dcf6a35e9d3f6d16b`, Actions `33291942505`, 592 | removed root package re-export facade; package root is namespace-only and CLI version uses installed distribution metadata |\n'
          additions = marker + '''| #70 | `3811fed18c9b1fdfac8f9dfcdb0125a62e1c1836`, Actions `33292200455`, 598 | moved root watermark/SCD2/Bronze/reconciliation/Fabric auth modules to explicit domain owners |
| #71 | `e3d3fd2a67c8a86b6bedb7b127ba53915599e8d8`, Actions `33292421348`, 605 | moved final root implementation modules; source root now contains only namespace `__init__.py` |
| #72 | `80d0efec39899d01b1a61515396896c397a3b70a`, Actions `33292517022`, 608 | removed recovery package re-export facade |
| #73 | `7c55c8179e50386d83ca945665e41251826eaf81`, Actions `33292620504`, 612 | removed capture and apply package re-export facades |
| #74 | `0b82a55981700484e68c5fb9f68de7c94a68b75b`, Actions `33302223695`, 615 | removed quality and orchestration package re-export facades |
'''
          if marker not in text:
              raise RuntimeError('HISTORY PR68 row missing')
          text = text.replace(marker, additions)
          history.write_text(text, encoding='utf-8')

          (root / '.github/workflows/docs-readability-74.yml').unlink()
          PY
      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: checkpoint canonical package layout through PR 74"
          git push origin HEAD:codex/docs-readability-baseline-74
