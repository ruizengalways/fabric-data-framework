name: candidate-release-proofs

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful main framework-ci run that built the exact candidate wheel"
        required: true
        type: string
      candidate_git_sha:
        description: "Exact 40-character candidate source SHA; dispatch this workflow at that same ref"
        required: true
        type: string
      candidate_wheel_sha256:
        description: "Exact inner candidate wheel SHA256 from CANDIDATE.json/SHA256SUMS"
        required: true
        type: string
      integration_inputs_run_id:
        description: "Successful exact-candidate candidate-integration-inputs workflow run"
        required: true
        type: string
      business_path_evidence_run_id:
        description: "Successful exact-candidate candidate-business-path-evidence workflow run"
        required: true
        type: string
      environment:
        description: "Approved Fabric environment represented by retained certification evidence"
        required: true
        default: DEV
        type: choice
        options: [DEV, UAT, PROD]

permissions:
  actions: read
  contents: read

concurrency:
  group: candidate-release-proofs-${{ inputs.candidate_git_sha }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_git_sha }}
      CANDIDATE_WHEEL_SHA256: ${{ inputs.candidate_wheel_sha256 }}
      INTEGRATION_INPUTS_RUN_ID: ${{ inputs.integration_inputs_run_id }}
      BUSINESS_PATH_RUN_ID: ${{ inputs.business_path_evidence_run_id }}
      CERTIFICATION_ENVIRONMENT: ${{ inputs.environment }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate exact-candidate inputs and dispatch ref
        run: |
          python - <<'PY'
          import os
          import re
          if re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE_SHA"]) is None:
              raise SystemExit("candidate_git_sha must be a 40-character lowercase git SHA")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["CANDIDATE_WHEEL_SHA256"]) is None:
              raise SystemExit("candidate_wheel_sha256 must be a 64-character lowercase SHA256")
          for name in ("CANDIDATE_RUN_ID", "INTEGRATION_INPUTS_RUN_ID", "BUSINESS_PATH_RUN_ID"):
              value = os.environ[name]
              if not value.isdigit() or int(value) < 1:
                  raise SystemExit(f"{name} must be a positive GitHub Actions run ID")
          if os.environ["GITHUB_SHA"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("candidate-release-proofs must be dispatched at the exact candidate ref")
          PY

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_git_sha }}
          fetch-depth: 0

      - name: Verify candidate source and main CI provenance
        id: candidate
        run: |
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          export RUN_JSON
          python - <<'PY'
          import json
          import os
          run = json.loads(os.environ["RUN_JSON"])
          if run["head_sha"] != os.environ["CANDIDATE_SHA"] or run["head_branch"] != "main":
              raise SystemExit("candidate CI does not bind exact main candidate SHA")
          if run["event"] != "push" or run["conclusion"] != "success" or run["path"] != ".github/workflows/ci.yml":
              raise SystemExit("candidate CI provenance is invalid")
          PY
          RUN_ATTEMPT="$(printf '%s' "${RUN_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["run_attempt"])')"
          echo "run_attempt=${RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100" > candidate-ci-jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          jobs = {item["name"]: item["conclusion"] for item in json.loads(Path("candidate-ci-jobs.json").read_text())["jobs"]}
          required = {"test-python-3.11", "test-python-3.13", "build-wheel", "release-readiness-contract"}
          missing = sorted(required - jobs.keys())
          failed = sorted(name for name in required if jobs.get(name) != "success")
          if missing or failed:
              raise SystemExit(f"candidate CI required jobs invalid: missing={missing}, failed={failed}")
          PY

      - name: Download and verify exact candidate wheel
        env:
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          rm -rf candidate-dist
          gh run download "${CANDIDATE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "framework-wheel-${CANDIDATE_SHA}" \
            --dir candidate-dist
          python src/fabric_data_framework/deployment/candidate_artifact.py verify \
            --dist-dir candidate-dist \
            --manifest candidate-dist/CANDIDATE.json \
            --candidate-sha "${CANDIDATE_SHA}" \
            --workflow-run-id "${CANDIDATE_RUN_ID}" \
            --workflow-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --expected-version "${FRAMEWORK_VERSION}" \
            --expected-wheel-sha256 "${CANDIDATE_WHEEL_SHA256}"
          (cd candidate-dist && sha256sum -c SHA256SUMS)

      - name: Verify retained producer provenance
        run: |
          for pair in \
            "${INTEGRATION_INPUTS_RUN_ID}:.github/workflows/candidate-integration-inputs.yml" \
            "${BUSINESS_PATH_RUN_ID}:.github/workflows/candidate-business-path-evidence.yml"; do
            run_id="${pair%%:*}"
            expected_path="${pair#*:}"
            RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            export RUN_JSON expected_path
            python - <<'PY'
          import json
          import os
          run = json.loads(os.environ["RUN_JSON"])
          if run["head_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("retained producer candidate SHA mismatch")
          if run["event"] != "workflow_dispatch" or run["conclusion"] != "success":
              raise SystemExit("retained producer must be a successful workflow_dispatch")
          if run["path"] != os.environ["expected_path"]:
              raise SystemExit("retained producer workflow path mismatch")
          PY
          done

      - name: Download exact integration inputs and business-path proof
        run: |
          rm -rf retained integration-inputs
          mkdir -p retained/static retained/business retained/final integration-inputs
          gh run download "${INTEGRATION_INPUTS_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "integration-inputs-${CANDIDATE_SHA}-${CERTIFICATION_ENVIRONMENT}" \
            --dir integration-inputs
          gh run download "${BUSINESS_PATH_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "business-path-release-proofs-${CANDIDATE_SHA}-${CERTIFICATION_ENVIRONMENT}" \
            --dir retained/business
          test -f integration-inputs/INPUTS.json
          test -f retained/business/business-path-release-proofs.json
          test -f retained/business/INPUTS.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install exact candidate wheel only
        run: |
          python -m pip install candidate-dist/*.whl
          python -m pip check

      - name: Authenticate integration input identity and business-path proof
        id: inputs
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from fabric_data_framework.evidence.business_path_evidence import BusinessPathGate
          from fabric_data_framework.evidence.release_readiness import ReleaseReadinessStatus, load_release_readiness_proofs

          inputs = json.loads(Path("integration-inputs/INPUTS.json").read_text())
          business_inputs = json.loads(Path("retained/business/INPUTS.json").read_text())
          if inputs != business_inputs:
              raise SystemExit("business-path evidence did not retain the exact integration input manifest")
          if inputs["candidate_git_sha"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("integration input candidate SHA mismatch")
          if inputs["candidate_wheel_sha256"] != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("integration input wheel SHA mismatch")
          input_hash = inputs.get("integration_inputs_hash")
          if re.fullmatch(r"[0-9a-f]{64}", input_hash or "") is None:
              raise SystemExit("integration_inputs_hash is invalid")

          proof = load_release_readiness_proofs("retained/business/business-path-release-proofs.json")
          if proof.candidate_git_sha != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("business-path proof candidate SHA mismatch")
          if proof.artifact_sha256 != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("business-path proof wheel SHA mismatch")
          if proof.integration_inputs_hash != input_hash:
              raise SystemExit("business-path proof integration input hash mismatch")
          expected = {gate.value for gate in BusinessPathGate}
          by_id = {item.gate_id: item for item in proof.results}
          if set(by_id) != expected:
              raise SystemExit("business-path proof gate coverage mismatch")
          failed = sorted(gate_id for gate_id, result in by_id.items() if result.status is not ReleaseReadinessStatus.PASS)
          if failed:
              raise SystemExit(f"business-path proof contains non-PASS gates: {failed}")
          Path("retained/integration-inputs-hash.txt").write_text(input_hash + "\n")
          PY
          echo "integration_inputs_hash=$(cat retained/integration-inputs-hash.txt)" >> "${GITHUB_OUTPUT}"

      - name: Build retained static partial release proof
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
          INTEGRATION_INPUTS_HASH: ${{ steps.inputs.outputs.integration_inputs_hash }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fabric_data_framework.evidence.release_readiness import (
              ReleaseReadinessGateKind,
              ReleaseReadinessProofBundle,
              ReleaseReadinessProofResult,
              ReleaseReadinessStatus,
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          candidate_run = os.environ["CANDIDATE_RUN_ID"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          wheel_sha = os.environ["CANDIDATE_WHEEL_SHA256"]
          input_run = os.environ["INTEGRATION_INPUTS_RUN_ID"]
          input_hash = os.environ["INTEGRATION_INPUTS_HASH"]
          bundle = ReleaseReadinessProofBundle(
              framework_version=os.environ["FRAMEWORK_VERSION"],
              candidate_git_sha=candidate_sha,
              artifact_sha256=wheel_sha,
              integration_inputs_hash=input_hash,
              results=(
                  ReleaseReadinessProofResult(
                      gate_id="source.tests",
                      kind=ReleaseReadinessGateKind.SOURCE_VERIFICATION,
                      status=ReleaseReadinessStatus.PASS,
                      evidence_references=(f"github-actions://{repo}/runs/{candidate_run}",),
                      detail="Exact candidate main CI required jobs completed successfully.",
                  ),
                  ReleaseReadinessProofResult(
                      gate_id="wheel.integrity",
                      kind=ReleaseReadinessGateKind.WHEEL_INTEGRITY,
                      status=ReleaseReadinessStatus.PASS,
                      evidence_references=(f"github-artifact://{repo}/runs/{candidate_run}/framework-wheel-{candidate_sha}",),
                      detail="Candidate manifest, checksums, wheel bytes, version and install were re-verified.",
                  ),
                  ReleaseReadinessProofResult(
                      gate_id="integration.inputs",
                      kind=ReleaseReadinessGateKind.INTEGRATION_INPUTS,
                      status=ReleaseReadinessStatus.PASS,
                      evidence_references=(
                          f"github-actions://{repo}/runs/{input_run}",
                          f"github-artifact://{repo}/runs/{input_run}/integration-inputs-{candidate_sha}-{os.environ['CERTIFICATION_ENVIRONMENT']}",
                      ),
                      detail="Framework-owned reference project and non-secret physical bindings were validated and bound by integration_inputs_hash.",
                  ),
              ),
          )
          Path("retained/static/static-release-proofs.json").write_text(
              json.dumps(bundle.model_dump(mode="json"), indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Strictly merge and validate complete non-integration release proof
        env:
          FRAMEWORK_VERSION: ${{ steps.candidate.outputs.version }}
          INTEGRATION_INPUTS_HASH: ${{ steps.inputs.outputs.integration_inputs_hash }}
        run: |
          fabric-framework release-proofs-merge \
            --spec "release/${FRAMEWORK_VERSION}/readiness-spec.json" \
            --input retained/static/static-release-proofs.json \
            --input retained/business/business-path-release-proofs.json \
            --output retained/final/release-proofs.json

          python - <<'PY'
          import os
          from fabric_data_framework.evidence.release_readiness import (
              ReleaseReadinessStatus,
              load_release_readiness_proofs,
              load_release_readiness_spec,
          )
          spec = load_release_readiness_spec(f"release/{os.environ['FRAMEWORK_VERSION']}/readiness-spec.json")
          bundle = load_release_readiness_proofs("retained/final/release-proofs.json")
          if bundle.candidate_git_sha != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("merged release proof candidate SHA mismatch")
          if bundle.artifact_sha256 != os.environ["CANDIDATE_WHEEL_SHA256"]:
              raise SystemExit("merged release proof wheel SHA mismatch")
          if bundle.integration_inputs_hash != os.environ["INTEGRATION_INPUTS_HASH"]:
              raise SystemExit("merged release proof integration input hash mismatch")
          required_non_integration = {gate.gate_id for gate in spec.gates if gate.required and gate.integration_check_id is None}
          by_id = {result.gate_id: result for result in bundle.results}
          if set(by_id) != required_non_integration:
              raise SystemExit(
                  "release proof must contain exactly every required non-integration gate: "
                  f"expected={sorted(required_non_integration)}, observed={sorted(by_id)}"
              )
          failed = sorted(gate_id for gate_id, result in by_id.items() if result.status is not ReleaseReadinessStatus.PASS)
          if failed:
              raise SystemExit(f"non-integration release proof gates not PASS: {failed}")
          PY
          cp integration-inputs/INPUTS.json retained/final/INPUTS.json

      - name: Upload exact-candidate release proof artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-proofs-${{ inputs.candidate_git_sha }}-${{ inputs.environment }}
          path: retained/final/
          if-no-files-found: error
          retention-days: 90
