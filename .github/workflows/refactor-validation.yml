name: temporary-refactor-validation

on:
  push:
    branches: [refactor/architecture-readability-boundaries]

permissions:
  contents: write

jobs:
  validate-and-fix:
    if: ${{ !contains(github.event.head_commit.message, '[validation-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/architecture-readability-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Complete hard-cut imports and remove generated artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('src').rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'from\s+\.+safety\s+import',
                  'from fabric_data_framework.contracts.audit_safety import',
                  text,
              )
              text = text.replace(
                  'fabric_data_framework.evidence.safety',
                  'fabric_data_framework.contracts.audit_safety',
              )
              path.write_text(text, encoding='utf-8')
          PY
          rm -rf src/fabric_data_framework.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -name '*.pyc' -delete
          rm -f .github/workflows/refactor-validation.yml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify current refactor boundary
        run: |
          ruff check src tests
          mypy \
            src/fabric_data_framework/contracts/runtime.py \
            src/fabric_data_framework/contracts/typed_values.py \
            src/fabric_data_framework/control_plane/repository.py \
            src/fabric_data_framework/recovery/runtime.py
          pytest -q \
            tests/test_evidence_safety_boundary.py \
            tests/test_current_projection.py \
            tests/test_current_projection_production_runtime.py \
            tests/test_evidence_import_smoke.py
          ruff check --isolated --select C901,PLR0913,PLR0915 \
            src/fabric_data_framework/adapters/fabric/current_projection.py
      - name: Commit validated cleanup
        run: |
          rm -rf src/fabric_data_framework.egg-info
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete hard-cut imports and validate projection stages [validation-generated]'
          git push origin HEAD:refactor/architecture-readability-boundaries
