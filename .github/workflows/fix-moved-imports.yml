name: fix-moved-imports

on:
  push:
    branches:
      - refactor/final-package-structure

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[moved-import-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/final-package-structure
          fetch-depth: 0
      - name: Fix imports in moved bounded contexts
        run: |
          python .github/fix_moved_imports.py
          if git diff --quiet; then
            echo "No moved import changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabric_data_framework
          git commit -m "Fix imports after bounded-context moves [moved-import-fix]"
          git push origin HEAD:refactor/final-package-structure
