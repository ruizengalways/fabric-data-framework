[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-data-framework"
version = "0.4.0"
description = "Metadata-driven Microsoft Fabric data engineering runtime contracts and reusable framework primitives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0,<2.1",
]

[project.scripts]
fabric-framework = "fabric_data_framework.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
