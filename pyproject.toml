[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-data-framework"
version = "0.4.0"
description = "Metadata-driven Microsoft Fabric data engineering runtime contracts and reusable framework primitives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<3",
  "SQLAlchemy>=2.0,<2.1",
]

[project.scripts]
fabric-framework = "fabric_data_framework.cli:main"

[project.entry-points."fabric_data_framework.capture_observers"]
"cert.capture-observer" = "fabric_data_framework.certification.fixtures:observe_capture"

[project.entry-points."fabric_data_framework.spark_execution_data"]
"cert.spark-execution-data" = "fabric_data_framework.certification.fixtures:spark_execution_data"

[project.entry-points."fabric_data_framework.warehouse_mutations"]
"cert.warehouse-mutation" = "fabric_data_framework.certification.fixtures:warehouse_mutation"

[project.entry-points."fabric_data_framework.warehouse_commit_fault_injectors"]
"cert.warehouse-fault" = "fabric_data_framework.certification.fixtures:warehouse_fault_injector"

[project.entry-points."fabric_data_framework.business_path_observers"]
"cert.business-path-observer" = "fabric_data_framework.certification.fixtures:observe_business_path"

[project.entry-points."fabric_data_framework.business_path_drivers"]
"cert.business-path-driver" = "fabric_data_framework.certification.fixtures:drive_business_path"

[project.entry-points."fabric_data_framework.applys"]
"cert.noop-apply" = "fabric_data_framework.certification.fixtures:forbidden_noop_apply"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fabric_data_framework.certification" = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the existing CI correctness baseline explicit in source control. Broader style
# families are intentionally enabled only after the existing tree has been remediated.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true
